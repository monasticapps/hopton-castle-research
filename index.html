<script id="report-data" type="application/json">{"title":"Hopton Castle Research Report: Restoration, Governance, Visitor Use, and Future Potential","path":"report.md","html":"\u003csection id=\"hopton-castle-research-report-restoration-governance-visitor-use-and-future-potential\" class=\"level1\"\u003e\n\u003ch1\u003eHopton Castle Research Report: Restoration, Governance, Visitor Use, and Future Potential\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003ePrepared for:\u003c/strong\u003e Pendragon Foundation research team\u003cbr /\u003e\n\u003cstrong\u003eEvidence base:\u003c/strong\u003e local \u003ccode\u003esources/\u003c/code\u003e files only\u003cbr /\u003e\n\u003cstrong\u003ePrimary routing file:\u003c/strong\u003e \u003ccode\u003esource-index.md\u003c/code\u003e\u003cbr /\u003e\n\u003cstrong\u003eResearch brief followed:\u003c/strong\u003e \u003ccode\u003einvestigative_angle/Pendragon_Working_Brief__Hopton_Castle_Master_Research_Brief.md\u003c/code\u003e\u003c/p\u003e\n\u003csection id=\"evidence-note\" class=\"level2\"\u003e\n\u003ch2\u003eEvidence Note\u003c/h2\u003e\n\u003cp\u003eThis report is source-grounded in the markdown files currently available in \u003ccode\u003esources/\u003c/code\u003e. It does not use live web verification. Where the available source base does not contain a figure, consent document, contract record, or current operational metric, the report marks that item as a gap rather than inferring it.\u003c/p\u003e\n\u003cp\u003eThe report uses readable source labels in evidence tables and source notes. The strongest sources for institutional facts are now \u003ccode\u003eFiscal Filings\u003c/code\u003e, \u003ccode\u003eCompanies House\u003c/code\u003e, \u003ccode\u003eCharity Register\u003c/code\u003e, \u003ccode\u003eCastle Website\u003c/code\u003e, \u003ccode\u003eArchaeological Survey\u003c/code\u003e, and \u003ccode\u003eBBC\u003c/code\u003e. \u003ccode\u003eFiscal Filings\u003c/code\u003e is especially important for filed annual finance and trustee-report details; \u003ccode\u003eCompanies House\u003c/code\u003e is especially important for company status and officer history. \u003ccode\u003eInfographic 1\u003c/code\u003e and \u003ccode\u003eInfographic 2\u003c/code\u003e are useful but imperfect AI readings of an outdoor interpretation board. \u003ccode\u003eGoogle Reviews\u003c/code\u003e and \u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e are used as visitor-perception evidence, not as historical authority.\u003c/p\u003e\n\u003c/section\u003e\n\u003csection id=\"source-key\" class=\"level2\"\u003e\n\u003ch2\u003eSource Key\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eSource Label\u003c/th\u003e\n\u003cth\u003eSource File\u003c/th\u003e\n\u003cth\u003eSource Type\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eIndex\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003esource-index.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eClean-source reference guide and routing index\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eBBC\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eBBC_News__Hopton_Castle_Reopened_After_Restoration.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eBBC News article\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eArchaeological Survey\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eEnglish_Heritage__Archaeological_Survey_Hopton_Castle_Earthworks.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eEnglish Heritage archaeological survey report\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eHopton_Castle_Website__Compiled_Structured_Notes.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eCompiled Hopton Castle website notes\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eCharity Register\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGOVUK_Charity_Register__Hopton_Castle_Preservation_Trust.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGOV.UK / charity-register-style record\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eCompanies House\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCompanies_House_Register__Hopton_Castle_Preservation_Trust__Company_Overview_Officer_Register.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eCompanies House company profile and officer register\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCompanies_House_Accounts__Hopton_Castle_Preservation_Trust/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eClean summary files from Companies House annual accounts, FY2005-FY2025\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic_Board__ChatGPT_Extraction.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eChatGPT extraction from on-site infographic board\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 2\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic_Board__Gemini_Extraction.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGemini extraction from on-site infographic board\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle_Reviews__Hopton_Castle.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGoogle reviews scrape\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eTripAdvisor_Reviews__Hopton_Castle.md\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eTripAdvisor reviews scrape\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/section\u003e\n\u003csection id=\"1-executive-summary\" class=\"level2\"\u003e\n\u003ch2\u003e1. Executive Summary\u003c/h2\u003e\n\u003cp\u003eHopton Castle is a ruined medieval tower house and earthwork complex in south Shropshire, near Craven Arms and Ludlow, within the Shropshire Hills Area of Outstanding Natural Beauty. The available evidence presents it as a small but nationally significant site: a Scheduled Ancient Monument according to \u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e, Grade I-listed according to \u003ccode\u003eBBC\u003c/code\u003e, a probable late 13th- or early 14th-century lordly residence, and a Civil War site associated with the 1644 siege and killing of the Parliamentarian garrison.\u003c/p\u003e\n\u003cp\u003eThe modern project was not a full domestic restoration. It was principally a conservation, repair, and public-access project. Hopton Castle Preservation Trust rescued a collapsing ruin, purchased the castle and surrounding earthworks, repaired and stabilised the monument, protected the earthworks during works, added visitor access and interpretation, and opened the site free to the public. The castle was not converted into a residence, major visitor attraction, commercial venue, or staffed heritage site.\u003c/p\u003e\n\u003cp\u003eThe Trust secured more than GBP1 million from Heritage Lottery Fund and other sources. \u003ccode\u003eCastle Website\u003c/code\u003e identifies Heritage Lottery Fund as the main funder, with a largest grant of GBP880,000, and English Heritage as a major contributor at about GBP250,000. The newly integrated Companies House accounts sharpen the sequence: FY2006 records GBP50,000 recognised restricted grant income split between HLF GBP45,000 and Shropshire County Council GBP5,000; FY2007-FY2009 accounts record the major HLF/EH grant awards and additional named bids; FY2010 records match funding and the start of physical works; and FY2011-FY2012 capture the largest restoration expenditure. The Charity Commission-style data records purchase on 15 September 2008 and works scheduled for completion in October 2011. Public access began at the end of September 2011, and the Duke of Gloucester officially opened the site on 1 December 2011.\u003c/p\u003e\n\u003cp\u003eCurrent use is low-intensity public heritage access. \u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e consistently describe a small, free, unstaffed, well-maintained ruin with strong interpretation, limited parking, no toilets or services, and donation-dependent upkeep. The latest filed accounts show a small operating charity: FY2025 income of GBP2,658, expenditure of GBP2,193, unrestricted funds of GBP10,731, restricted funds of GBP76,814, and total funds of GBP87,545. The Companies House register shows an active company limited by guarantee, incorporated on 25 March 2003, with SIC code \u003ccode\u003e91030\u003c/code\u003e, 15 active officers, and accounts made up to 31 March 2025.\u003c/p\u003e\n\u003csection id=\"key-findings\" class=\"level3\"\u003e\n\u003ch3\u003eKey Findings\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eHopton is best treated as a \u003cstrong\u003eruin-conservation and public-access case study\u003c/strong\u003e, not a residential restoration case.\u003c/li\u003e\n\u003cli\u003eThe project was justified by a combination of national significance, collapse risk, Civil War history, architectural interest, AONB landscape value, and local campaigning.\u003c/li\u003e\n\u003cli\u003eThe strongest known funding figures are: over GBP1 million total secured, GBP880,000 from Heritage Lottery Fund, about GBP250,000 from English Heritage, and filed-account restoration expenditure of GBP519,635 in FY2011 and GBP219,092 in FY2012.\u003c/li\u003e\n\u003cli\u003eThe Companies House accounts confirm a sharp transition from capital rescue to maintenance operation: after the major works period, annual income mostly sits in the low thousands, with FY2022 as a donation/grant outlier.\u003c/li\u003e\n\u003cli\u003eThe company register adds current governance context: the active company has 15 active officers, including one secretary and 14 directors, with 52 total registered officers and 37 resignations across its history.\u003c/li\u003e\n\u003cli\u003eThe source base does not provide a detailed capital-cost schedule, conveyancing terms, tender records, full consent pathway, visitor numbers, or current maintenance plan; it does now show a GBP50,000 heritage/capital asset value in the accounts.\u003c/li\u003e\n\u003cli\u003eVisitor experience evidence is strong: Hopton works well as a short, quiet, donation-supported, interpretation-rich stop within a wider Shropshire/Welsh Marches heritage and walking itinerary.\u003c/li\u003e\n\u003cli\u003eFuture opportunity appears strongest in low-impact areas: donations, interpretation, trails, volunteer learning, digital engagement, archaeology-led education, and sensitive landscape/ecology framing.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection id=\"2-site-identity-and-heritage-status\" class=\"level2\"\u003e\n\u003ch2\u003e2. Site Identity and Heritage Status\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eItem\u003c/th\u003e\n\u003cth\u003eEvidence\u003c/th\u003e\n\u003cth\u003eSource\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eLocation\u003c/td\u003e\n\u003ctd\u003eHopton Castle is in south Shropshire, near Craven Arms, about 10 miles west or 11 miles north-west of Ludlow, between the Clun and Teme valleys.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eArchaeological Survey\u003c/code\u003e; \u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eBBC\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGoogle Maps\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://maps.app.goo.gl/JhjMuKBUVzAajqNC7\"\u003eOpen Hopton Castle on Google Maps\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eGoogle Maps link provided for navigation.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGrid/reference data\u003c/td\u003e\n\u003ctd\u003eNGR \u003ccode\u003eSO 367 779\u003c/code\u003e; NMR \u003ccode\u003eSO 37 NE 27\u003c/code\u003e; parish Hopton Castle; district South Shropshire.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eArchaeological Survey\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSetting\u003c/td\u003e\n\u003ctd\u003eValley-bottom site at about 150m OD, in a small valley opening into a substantial bowl surrounded by hills.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eArchaeological Survey\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLandscape designation\u003c/td\u003e\n\u003ctd\u003eWithin the Shropshire Hills AONB, described as part of the area's cultural heritage and distinctive character.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eBuilding/site type\u003c/td\u003e\n\u003ctd\u003eRuined medieval fortified tower house or lordly residence with surrounding earthworks, rather than a defensive keep in the strict sense.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eArchaeological Survey\u003c/code\u003e; \u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDate and interpretation\u003c/td\u003e\n\u003ctd\u003eThe source places the visible tower in the late 13th or early 14th century, possibly built in an intentionally archaic form resembling a Norman donjon.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eArchaeological Survey\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHeritage status\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e call it a Scheduled Ancient Monument; \u003ccode\u003eBBC\u003c/code\u003e calls it Grade I-listed.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e; \u003ccode\u003eInfographic 2\u003c/code\u003e; \u003ccode\u003eBBC\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOwnership/charity/company status\u003c/td\u003e\n\u003ctd\u003eHopton Castle Preservation Trust is charity number \u003ccode\u003e1116210\u003c/code\u003e and company number \u003ccode\u003e04710194\u003c/code\u003e; it is an active company limited by guarantee, incorporated 25 March 2003, with SIC code \u003ccode\u003e91030\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCharity Register\u003c/code\u003e; \u003ccode\u003eCompanies House\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFiled-account heritage asset treatment\u003c/td\u003e\n\u003ctd\u003eCompanies House accounts carry Hopton Castle / heritage assets at GBP50,000 from the acquisition/restoration period onward.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003csection id=\"interpretive-position\" class=\"level3\"\u003e\n\u003ch3\u003eInterpretive Position\u003c/h3\u003e\n\u003cp\u003eHopton Castle should be described carefully. The word \u003ccode\u003ecastle\u003c/code\u003e is locally and historically established, but the physical evidence points to a high-status residential tower house or manorial complex rather than a purely military stronghold. The \u003ccode\u003eArchaeological Survey\u003c/code\u003e describes the surviving tower as a grand lordly residence requiring ancillary service buildings. It notes deliberate archaic references to Norman keep forms, but stresses that the tower was not self-sufficient.\u003c/p\u003e\n\u003cp\u003eThe site also extends beyond the tower. The earthworks include a mound, bailey-like enclosure, possible outer bailey or garden compartment, water-management features, ornamental ponds, a leat, possible building platforms, and other unresolved features. This makes Hopton a landscape and archaeology case as much as a masonry-repair case.\u003c/p\u003e\n\u003c/section\u003e\n\u003csection id=\"why-this-site-was-a-compelling-conservation-target\" class=\"level3\"\u003e\n\u003ch3\u003eWhy This Site Was a Compelling Conservation Target\u003c/h3\u003e\n\u003cp\u003eThe available sources identify several overlapping reasons:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe castle was at risk of total collapse according to the \u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eIt was nationally significant because of its Scheduled Ancient Monument status, early 14th-century tower-house character, and Civil War siege history.\u003c/li\u003e\n\u003cli\u003eIt sat within the Shropshire Hills AONB and formed part of the cultural landscape of the Welsh Marches.\u003c/li\u003e\n\u003cli\u003eIt had a strong public story: the 1644 siege, \u003ccode\u003eHopton Quarter\u003c/code\u003e, and later ruin.\u003c/li\u003e\n\u003cli\u003eLocal campaigning had already built institutional momentum through the Trust and Friends network.\u003c/li\u003e\n\u003cli\u003eThe site had enough surviving fabric and earthwork context to make conservation meaningful, but required intervention before further loss.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/section\u003e\n\u003csection id=\"land-and-earthwork-context\" class=\"level3\"\u003e\n\u003ch3\u003eLand and Earthwork Context\u003c/h3\u003e\n\u003cp\u003eThe sources state that the Trust purchased the castle and surrounding earthworks, and the FY2009 Companies House summary describes the acquired curtilage as five-and-a-half acres. The archaeological record makes clear that the meaningful conservation area is broader than the tower: it includes the mound, bailey, outer space or garden compartment, water features, leat, possible building platforms, and nearby earthworks. The exact mapped ownership boundary remains a research gap even though the account narrative gives the acreage/curtilage description.\u003c/p\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection id=\"3-image-orientation-and-catalogue\" class=\"level2\"\u003e\n\u003ch2\u003e3. Image Orientation and Catalogue\u003c/h2\u003e\n\u003cp\u003eThe image catalogue uses the current A-B-C-D wall convention. The raw image folder is not the naming authority for this appendix; the standardized files in \u003ccode\u003eimages/\u003c/code\u003e are. In this convention, wall A has the main entrance.\u003c/p\u003e\n\u003csection id=\"top-down-orientation-diagram\" class=\"level3\"\u003e\n\u003ch3\u003eTop-Down Orientation Diagram\u003c/h3\u003e\n\u003cpre class=\"text\"\u003e\u003ccode\u003e                         Wall D\n                 Corner DA     Corner CD\n                    +-------------+\n                    |             |\n        Wall A      |             |      Wall C\n   MAIN ENTRANCE -\u0026gt; |             |\n                    |             |\n                    +-------------+\n                 Corner AB     Corner BC\n                         Wall B\n\nCounterclockwise exterior sequence used below: A -\u0026gt; AB -\u0026gt; B -\u0026gt; BC -\u0026gt; C -\u0026gt; CD -\u0026gt; D -\u0026gt; DA.\nInterior sequence uses the same physical circuit; interior corner filenames preserve the left-to-right view label, so the C/D corner may appear as DC and the D/A corner may appear as AD.\u003c/code\u003e\u003c/pre\u003e\n\u003c/section\u003e\n\u0 /corner-AD-inside-01.jpg\" alt=\"Corner AD inside #01\" style=\"width: 100%; height: 260px; max-height: 260px; object-fit: cover; border: 1px solid #d0d0d0;\"\u003e\u003c/a\u003e\n    \u003cfigcaption style=\"font-size: 0.85em; line-height: 1.25; margin-top: 4px;\"\u003eCorner AD inside #01\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\u003c/div\u003e\n\n\u003c/section\u003e\n\u003csection id=\"miscellaneous-images\" class=\"level3\"\u003e\n\u003ch3\u003eMiscellaneous Images\u003c/h3\u003e\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start;\"\u003e\n  \u003cfigure style=\"margin: 0;\"\u003e\n    \u003ca href=\"images/misc/infographic-board-01.webp\"\u003e\u003cimg src=\"images/misc/infographic-board-01.webp\" alt=\"infographic board #01\" style=\"width: 100%; height: 260px; max-height: 260px; object-fit: cover; border: 1px solid #d0d0d0;\"\u003e\u003c/a\u003e\n    \u003cfigcaption style=\"font-size: 0.85em; line-height: 1.25; margin-top: 4px;\"\u003einfographic board #01\u003c/figcaption\u003e\n  \u003c/figure\u003e\n  \u003cfigure style=\"margin: 0;\"\u003e\n    \u003ca href=\"images/misc/site-satellite-image-01.png\"\u003e\u003cimg src=\"images/misc/site-satellite-image-01.png\" alt=\"site satellite image #01\" style=\"width: 100%; height: 260px; max-height: 260px; object-fit: cover; border: 1px solid #d0d0d0;\"\u003e\u003c/a\u003e\n    \u003cfigcaption style=\"font-size: 0.85em; line-height: 1.25; margin-top: 4px;\"\u003esite satellite image #01\u003c/figcaption\u003e\n  \u003c/figure\u003e\n  \u003cfigure style=\"margin: 0;\"\u003e\n    \u003ca href=\"images/misc/site-sign-post-01.webp\"\u003e\u003cimg src=\"images/misc/site-sign-post-01.webp\" alt=\"site sign post #01\" style=\"width: 100%; height: 260px; max-height: 260px; object-fit: cover; border: 1px solid #d0d0d0;\"\u003e\u003c/a\u003e\n    \u003cfigcaption style=\"font-size: 0.85em; line-height: 1.25; margin-top: 4px;\"\u003esite sign post #01\u003c/figcaption\u003e\n  \u003c/figure\u003e\n  \u003cfigure style=\"margin: 0;\"\u003e\n    \u003ca href=\"images/misc/story-board-01.webp\"\u003e\u003cimg src=\"images/misc/story-board-01.webp\" alt=\"story board #01\" style=\"width: 100%; height: 260px; max-height: 260px; object-fit: cover; border: 1px solid #d0d0d0;\"\u003e\u003c/a\u003e\n    \u003cfigcaption style=\"font-size: 0.85em; line-height: 1.25; margin-top: 4px;\"\u003estory board #01\u003c/figcaption\u003e\n  \u003c/figure\u003e\n  \u003cfigure style=\"margin: 0;\"\u003e\n    \u003ca href=\"images/misc/story-board-02.webp\"\u003e\u003cimg src=\"images/misc/story-board-02.webp\" alt=\"story board #02\" style=\"width: 100%; height: 260px; max-height: 260px; object-fit: cover; border: 1px solid #d0d0d0;\"\u003e\u003c/a\u003e\n    \u003cfigcaption style=\"font-size: 0.85em; line-height: 1.25; margin-top: 4px;\"\u003estory board #02\u003c/figcaption\u003e\n  \u003c/figure\u003e\n  \u003cfigure style=\"margin: 0;\"\u003e\n    \u003ca href=\"images/misc/surrounding-landscape-01.webp\"\u003e\u003cimg src=\"images/misc/surrounding-landscape-01.webp\" alt=\"surrounding landscape #01\" style=\"width: 100%; height: 260px; max-height: 260px; object-fit: cover; border: 1px solid #d0d0d0;\"\u003e\u003c/a\u003e\n    \u003cfigcaption style=\"font-size: 0.85em; line-height: 1.25; margin-top: 4px;\"\u003esurrounding landscape #01\u003c/figcaption\u003e\n  \u003c/figure\u003e\n  \u003cfigure style=\"margin: 0;\"\u003e\n    \u003ca href=\"images/misc/window-view-01.webp\"\u003e\u003cimg src=\"images/misc/window-view-01.webp\" alt=\"window view #01\" style=\"width: 100%; height: 260px; max-height: 260px; object-fit: cover; border: 1px solid #d0d0d0;\"\u003e\u003c/a\u003e\n    \u003cfigcaption style=\"font-size: 0.85em; line-height: 1.25; margin-top: 4px;\"\u003ewindow view #01\u003c/figcaption\u003e\n  \u003c/figure\u003e\n\u003c/div\u003e\n\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection id=\"4-historical-development\" class=\"level2\"\u003e\n\u003ch2\u003e4. Historical Development\u003c/h2\u003e\n\u003cp\u003eThe site sits in a landscape with prehistoric and early settlement evidence. The \u003ccode\u003eArchaeological Survey\u003c/code\u003e records late prehistoric enclosures visible as cropmarks south-east of the castle and scatters of prehistoric stone tools along the ridge to the north. Hopton appears in Domesday as \u003ccode\u003eOpetune\u003c/code\u003e, though \u003ccode\u003eArchaeological Survey\u003c/code\u003e cautions that it is doubtful whether this refers to a nucleated settlement on the present village site.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eCastle Website\u003c/code\u003e gives the early ownership sequence as Eadric before the Norman Conquest, Roger de Montgomery by Domesday, Picot de Say as tenant, and Walter de Opton/de Hopton by 1165. The de Hoptons held the estate into the 15th century. The earliest written reference cited in \u003ccode\u003eCastle Website\u003c/code\u003e is to the \u003ccode\u003ecastles of Hoptoune\u003c/code\u003e in a 1264 case against Sir Walter de Hopton.\u003c/p\u003e\n\u003cp\u003eThe surviving tower is most likely late 13th- or early 14th-century. The \u003ccode\u003eArchaeological Survey\u003c/code\u003e identifies it as a lordly residence, probably associated with Walter de Hopton, and places it among substantial Shropshire houses built in the generation after Edward I's conquest of Wales. It compares the site with Clun, Acton Burnell, Stokesay, and possibly Wattlesborough.\u003c/p\u003e\n\u003cp\u003eThe estate later passed through the Corbets of Moreton Corbet and then to the Wallops. Sir Henry Wallop is reported to have made improvements, though the extent is uncertain. \u003ccode\u003eArchaeological Survey\u003c/code\u003e and \u003ccode\u003eCastle Website\u003c/code\u003e both refer to a \u003ccode\u003enew brick house\u003c/code\u003e likely associated with the early modern Wallop period and apparently located within the bailey enclosure.\u003c/p\u003e\n\u003cp\u003eThe Civil War episode dominates the public history. In 1644, Hopton Castle was held for Parliament by a small garrison commanded by Samuel More. Royalist forces associated with Prince Rupert and led locally by Sir Michael Woodhouse besieged the site. After the defenders surrendered, most of the garrison were reportedly killed. The phrase \u003ccode\u003eHopton Quarter\u003c/code\u003e became a byword for treacherous or merciless treatment.\u003c/p\u003e\n\u003cp\u003eAfter the siege, the castle appears to have been abandoned as a residence. \u003ccode\u003eCastle Website\u003c/code\u003e says 17th-century tax records suggest no one lived in the castle after the Civil War, and 18th- and 19th-century depictions show a ruin similar to the modern outline. Ownership later passed to the Beale family, then to Sir Edward Ripley in 1890, and in the mid-1950s to the Williams family, farmers in Hopton Castle.\u003c/p\u003e\n\u003cp\u003eThe 20th-century record is one of limited action and increasing fragility. A Ministry of Works inspector requested a fence in 1946 to prevent cattle damage. The Williams family later contacted the Ministry of Works about the danger posed by the fragile building, but the estimated repair cost of GBP17,000 could not be afforded. Minor Ministry of Works repairs in the 1950s and 1960s kept the monument standing, but the larger preservation campaign only revived in the mid-1990s through local people later represented by Hopton Castle Preservation Trust.\u003c/p\u003e\n\u003c/section\u003e\n\u003csection id=\"5-pre-restoration-condition-and-conservation-need\" class=\"level2\"\u003e\n\u003ch2\u003e5. Pre-Restoration Condition and Conservation Need\u003c/h2\u003e\n\u003cp\u003eThe pre-restoration condition was a ruined and fragile medieval tower house, abandoned since the Civil War and vulnerable to collapse. \u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e state that the building was in danger of total collapse despite its national significance. The \u003ccode\u003eCastle Website\u003c/code\u003e records decades of minimal repairs, cattle-damage concern, unaffordable mid-century repair estimates, and continuing fabric loss.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eRisk Category\u003c/th\u003e\n\u003cth\u003eEvidence\u003c/th\u003e\n\u003cth\u003eImplication for Conservation\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eStructural/fabric risk\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e state the castle was in danger of total collapse; \u003ccode\u003eBBC\u003c/code\u003e describes a ruin restored at about GBP1m cost.\u003c/td\u003e\n\u003ctd\u003eStabilisation and masonry repair were essential before safe public access.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWeathering risk\u003c/td\u003e\n\u003ctd\u003eBoard captions describe sealing wall tops against rainwater and weather.\u003c/td\u003e\n\u003ctd\u003eExposed wall heads needed protection to prevent continuing decay.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRubble/debris risk\u003c/td\u003e\n\u003ctd\u003eBoard captions describe removal of a large volume of rubble to reveal original floor level.\u003c/td\u003e\n\u003ctd\u003eInterior archaeology and safe access required controlled clearance.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEarthwork risk\u003c/td\u003e\n\u003ctd\u003eBoard captions say a small monorail was used to avoid damaging earthworks during debris removal.\u003c/td\u003e\n\u003ctd\u003eConservation had to protect archaeological deposits beyond the tower walls.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAccess/safety risk\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e notes later bridge, steps, ramp, car park, and information board; board warns of uneven surfaces, reduced head height/light, unfenced pond, livestock/manure, and self-closing gates.\u003c/td\u003e\n\u003ctd\u003ePublic access required infrastructure and safety messaging, but did not eliminate inherent rural-ruin hazards.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eKnowledge risk\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e notes initial surveys were needed to support purchase and rescue bids.\u003c/td\u003e\n\u003ctd\u003eArchaeological and architectural understanding was part of project justification and design.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003csection id=\"before--after-summary\" class=\"level3\"\u003e\n\u003ch3\u003eBefore / After Summary\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003cth\u003eBefore Project\u003c/th\u003e\n\u003cth\u003eAfter Project\u003c/th\u003e\n\u003cth\u003eEvidence\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eStructural condition\u003c/td\u003e\n\u003ctd\u003eLong-abandoned ruin; fragile fabric; danger of collapse.\u003c/td\u003e\n\u003ctd\u003eStabilised, repaired, wall heads protected, limited arches rebuilt where collapse risk justified it.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e; \u003ccode\u003eBBC\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePublic access\u003c/td\u003e\n\u003ctd\u003eNo developed visitor access; frustration over lack of access noted in literary/book-trail context.\u003c/td\u003e\n\u003ctd\u003eOpen to visitors from end of September 2011; officially opened 1 December 2011.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eBBC\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOwnership/governance\u003c/td\u003e\n\u003ctd\u003ePrivately owned ruin before Trust purchase.\u003c/td\u003e\n\u003ctd\u003eHeld by Hopton Castle Preservation Trust, an active company limited by guarantee and registered charity.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eBBC\u003c/code\u003e; \u003ccode\u003eCharity Register\u003c/code\u003e; \u003ccode\u003eCompanies House\u003c/code\u003e; \u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInterpretation\u003c/td\u003e\n\u003ctd\u003eLimited public interpretation in the pre-project state.\u003c/td\u003e\n\u003ctd\u003eInformation board, illustrated/free leaflet, metal-leaved book/story panels, on-site history and safety guidance.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e; \u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVisitor infrastructure\u003c/td\u003e\n\u003ctd\u003eNo clear evidence of public car park/access infrastructure.\u003c/td\u003e\n\u003ctd\u003eSmall car park, improved bridge, steps, ramp, interpretation, fenced site boundary.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eBBC\u003c/code\u003e; \u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLandscape/earthworks\u003c/td\u003e\n\u003ctd\u003eComplex earthworks existed but required survey and interpretation.\u003c/td\u003e\n\u003ctd\u003eEarthworks documented by \u003ccode\u003eArchaeological Survey\u003c/code\u003e; visitors still appear to notice them less consistently than the tower.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eArchaeological Survey\u003c/code\u003e; \u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection id=\"6-acquisition-and-ownership-pathway\" class=\"level2\"\u003e\n\u003ch2\u003e6. Acquisition and Ownership Pathway\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eDate / Period\u003c/th\u003e\n\u003cth\u003eOwnership or Governance Event\u003c/th\u003e\n\u003cth\u003eSource Notes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eBy 1066\u003c/td\u003e\n\u003ctd\u003eEadric owned Opetoune, Clun, and Hopesay.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1086\u003c/td\u003e\n\u003ctd\u003eArea held by Roger de Montgomery; Picot de Say held the manor from him.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eBy 1165\u003c/td\u003e\n\u003ctd\u003eWalter de Opton/de Hopton owned the manor.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15th century\u003c/td\u003e\n\u003ctd\u003eEstate descended by marriage to the Corbets of Moreton Corbet.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eArchaeological Survey\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16th century\u003c/td\u003e\n\u003ctd\u003eEstate passed to Sir Henry Wallop of Hampshire.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1644\u003c/td\u003e\n\u003ctd\u003eRobert Wallop owned the castle during the Civil War siege.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eArchaeological Survey\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1655\u003c/td\u003e\n\u003ctd\u003eRobert Wallop sold Hopton to the Beale family.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1890\u003c/td\u003e\n\u003ctd\u003eBeale family sold remnants of the estate to Sir Edward Ripley of Bedstone Court.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMid-1950s\u003c/td\u003e\n\u003ctd\u003eLand sold to the Williams family, farmers in Hopton Castle.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMid-1990s\u003c/td\u003e\n\u003ctd\u003eLocal people revived the preservation cause.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1995\u003c/td\u003e\n\u003ctd\u003eHopton Castle Preservation Trust formed informally.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1997\u003c/td\u003e\n\u003ctd\u003eTrust became more official as a company limited by guarantee.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e25 March 2003\u003c/td\u003e\n\u003ctd\u003eCompany incorporated.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCompanies House\u003c/code\u003e; \u003ccode\u003eCastle Website\u003c/code\u003e; company number \u003ccode\u003e04710194\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e31 March 2005\u003c/td\u003e\n\u003ctd\u003eFiled accounts show nil income, expenditure, assets, and cash at bank.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e; pre-capital-project dormant/minimal activity signal.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFY2006\u003c/td\u003e\n\u003ctd\u003eFiled account notes describe the charity applying for funds to purchase, restore, maintain, and open the castle to the public; recognised restricted grant income is HLF GBP45,000 and SCC GBP5,000.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e; use carefully because OCR of the narrative is less clear than the accounting note.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e25 September 2006\u003c/td\u003e\n\u003ctd\u003eCharity registration date.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCharity Register\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFY2007\u003c/td\u003e\n\u003ctd\u003eHLF GBP880,000 and English Heritage GBP150,000 bids recorded as successful, with surveys and tenders under way.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e; funds to be paid over project duration.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFY2008\u003c/td\u003e\n\u003ctd\u003eInitial site surveys by architects, quantity surveyors, and engineers were completed by December 2007; HLF/EH grants confirmed; additional bids recorded.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15 September 2008\u003c/td\u003e\n\u003ctd\u003ePurchase of castle and its five-and-a-half-acre curtilage completed.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e; \u003ccode\u003eCharity Register\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFY2009\u003c/td\u003e\n\u003ctd\u003eFiled accounts record post-purchase public liability insurance, repair/access tenders, local fundraising, media-driven donations, and the heritage/capital asset at GBP50,000.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAutumn 2009\u003c/td\u003e\n\u003ctd\u003ePhysical works began.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e; contractor identified as Conservation Building Services of Oswestry.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFY2010\u003c/td\u003e\n\u003ctd\u003eMatching funding required by HLF and English Heritage was achieved; Leader Fund and Local Joint Committee support recorded.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEnd September 2011\u003c/td\u003e\n\u003ctd\u003ePublic access provided.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1 December 2011\u003c/td\u003e\n\u003ctd\u003eOfficial opening by HRH The Duke of Gloucester.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eBBC\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e03 August 2023\u003c/td\u003e\n\u003ctd\u003eGoverning document amended.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCharity Register\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e24 October 2024\u003c/td\u003e\n\u003ctd\u003e2024 accounts approved by trustees.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e31 March 2025\u003c/td\u003e\n\u003ctd\u003eLatest filed accounts currently in clean source base.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e; \u003ccode\u003eCharity Register\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e18 September 2025\u003c/td\u003e\n\u003ctd\u003eFY2025 trustees' report approved and signed on behalf of the board by J W George.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e25 September 2025\u003c/td\u003e\n\u003ctd\u003eMichael John Lynskey appointed director; Jennifer Mary Marquis resigned as director according to company-register compilation.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCompanies House\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13 March 2026\u003c/td\u003e\n\u003ctd\u003eLast confirmation statement dated.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCompanies House\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe acquisition pathway was trust-led and grant-enabled. The source base now gives more hard detail than the earlier report: the FY2009 accounts describe the acquired curtilage as five-and-a-half acres, and the filed accounts carry the heritage/capital asset at GBP50,000. However, the source base still does not provide sale contract terms, conveyancing detail, a boundary plan, or a definitive statement that the GBP50,000 carrying value equals the full legal purchase consideration. It does state that the purchase included the castle and surrounding earthworks and that the current charity owns and/or leases land or property.\u003c/p\u003e\n\u003c/section\u003e\n\u003csection id=\"7-regulatory-and-heritage-permissions\" class=\"level2\"\u003e\n\u003ch2\u003e7. Regulatory and Heritage Permissions\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eRegulatory / Heritage Status or Permission\u003c/th\u003e\n\u003cth\u003eEvidence in Sources\u003c/th\u003e\n\u003cth\u003eConfidence / Gap\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eScheduled Ancient Monument\u003c/td\u003e\n\u003ctd\u003eBoth \u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e describe the castle as a Scheduled Ancient Monument.\u003c/td\u003e\n\u003ctd\u003eHigh for source presence; exact schedule entry not included in local source base.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGrade I listing\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eBBC\u003c/code\u003e calls Hopton Castle a Grade I-listed Shropshire castle.\u003c/td\u003e\n\u003ctd\u003eHigh for \u003ccode\u003eBBC\u003c/code\u003e statement; listing entry not included in local source base.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAncient Monument / Grade I language in filed accounts\u003c/td\u003e\n\u003ctd\u003eCompanies House summaries repeatedly state that the Trust's principal activity is to maintain the castle as an Ancient Monument and Grade I Listed Building.\u003c/td\u003e\n\u003ctd\u003eHigh for Trust/accounting statement; still not a substitute for official Historic England list/schedule entries.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEnglish Heritage permission to rebuild arches\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eBBC\u003c/code\u003e states English Heritage gave the Trust permission to rebuild two arches, one leading to a spiral staircase.\u003c/td\u003e\n\u003ctd\u003eHigh for this specific permission; do not infer complete consent pathway from it alone.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEnglish Heritage funding and expertise\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e states English Heritage made a significant contribution and provided expertise/advice; funding about GBP250,000.\u003c/td\u003e\n\u003ctd\u003eHigh in \u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHistoric/heritage-body involvement in surveys\u003c/td\u003e\n\u003ctd\u003eEnglish Heritage commissioned the earthworks survey; \u003ccode\u003eArchaeological Survey\u003c/code\u003e is report AI/20/2005.\u003c/td\u003e\n\u003ctd\u003eHigh.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eScheduled Monument Consent\u003c/td\u003e\n\u003ctd\u003eNot explicitly documented in available sources.\u003c/td\u003e\n\u003ctd\u003eGap: needs Historic England/local planning/consent records.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eListed Building Consent\u003c/td\u003e\n\u003ctd\u003eNot explicitly documented in available sources.\u003c/td\u003e\n\u003ctd\u003eGap: needs local authority/Historic England records.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePlanning permission for visitor infrastructure\u003c/td\u003e\n\u003ctd\u003eBridge, steps, ramp, parking, and access works are mentioned, but consent route is not detailed.\u003c/td\u003e\n\u003ctd\u003eGap.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe most defensible statement is that Hopton was protected, English Heritage was involved, and at least one specific permission concerning arches is recorded by \u003ccode\u003eBBC\u003c/code\u003e. The local source base does not contain a full permissions file.\u003c/p\u003e\n\u003c/section\u003e\n\u003csection id=\"8-surveys-assessments-and-knowledge-base\" class=\"level2\"\u003e\n\u003ch2\u003e8. Surveys, Assessments, and Knowledge Base\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eSource / Study\u003c/th\u003e\n\u003cth\u003eDate\u003c/th\u003e\n\u003cth\u003eContribution\u003c/th\u003e\n\u003cth\u003eRelevance to Restoration\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eSamuel More, \u003ccode\u003eJournal of the Siege of Hopton Castle\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eContemporary or near-contemporary to 1644 aftermath; transcription date uncertain in website notes\u003c/td\u003e\n\u003ctd\u003eCore account of siege, surrender, and killings.\u003c/td\u003e\n\u003ctd\u003eProvides historical significance and interpretive narrative, but not restoration methodology.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eP. E. Curnow, \u003ccode\u003eThe Tower House at Hopton Castle and its Affinities\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1989\u003c/td\u003e\n\u003ctd\u003eArchitectural interpretation; tower-house framing; comparison with other sites.\u003c/td\u003e\n\u003ctd\u003eHelped establish what kind of building was being conserved.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eP. M. Remfry, \u003ccode\u003eHopton Castle\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e1994\u003c/td\u003e\n\u003ctd\u003eHistorical/archaeological commentary referenced by \u003ccode\u003eArchaeological Survey\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eBackground context before major rescue campaign.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMarches Archaeology, archaeological evaluation\u003c/td\u003e\n\u003ctd\u003e2005\u003c/td\u003e\n\u003ctd\u003eArchaeological evaluation listed among the five core website sources.\u003c/td\u003e\n\u003ctd\u003eSupported purchase/rescue bids and conservation understanding.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEnglish Heritage, \u003ccode\u003eHopton Castle, Shropshire: A Survey of the Earthworks\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSurvey September 2005; report 2006\u003c/td\u003e\n\u003ctd\u003eDetailed earthwork, landscape, settlement, water-feature, and siege-context survey.\u003c/td\u003e\n\u003ctd\u003eCrucial for protecting and interpreting the broader site beyond the tower.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCompanies House trustee-report notes on preparatory surveys\u003c/td\u003e\n\u003ctd\u003eFY2006-FY2008\u003c/td\u003e\n\u003ctd\u003eFY2006 notes project-manager coordination of architectural, archaeological, geophysical, interpretative, and access surveys; FY2007 notes architectural, archaeological, engineering, and quantity surveys; FY2008 says initial surveys by architects, quantity surveyors, and engineers were completed by December 2007.\u003c/td\u003e\n\u003ctd\u003eProvides official annual-report confirmation that survey work was a prerequisite to grant approval and restoration planning.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRichard K. Morriss Associates, archaeological and architectural analysis\u003c/td\u003e\n\u003ctd\u003e2006\u003c/td\u003e\n\u003ctd\u003eTower fabric, construction, layout, condition, floor, and reconstruction evidence, as summarised in website notes.\u003c/td\u003e\n\u003ctd\u003eInformed repair/conservation decisions and interpretation.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTime Team / Wessex Archaeology\u003c/td\u003e\n\u003ctd\u003eJune 2009 and subsequent report/programme\u003c/td\u003e\n\u003ctd\u003eThree-day dig; finds included Roman coin, human tooth, cannon ball, gold James I quarter laurel; programme focused on siege but found medieval evidence.\u003c/td\u003e\n\u003ctd\u003eAdded public visibility and archaeological knowledge, but source base lacks the full Wessex report.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe research base was unusually important for a small ruin because the project needed to justify purchase, funding, and intervention. \u003ccode\u003eCastle Website\u003c/code\u003e says the Trust raised funds for two initial surveys to support bids for purchase and rescue, and English Heritage commissioned the earthworks survey. Specialist knowledge from Jeff George, Peter Curnow, Sula Rayska, Richard Morriss, and others appears to have shaped the project.\u003c/p\u003e\n\u003csection id=\"main-knowledge-contributions\" class=\"level3\"\u003e\n\u003ch3\u003eMain Knowledge Contributions\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eThe tower is probably a high-status residence rather than a conventional keep.\u003c/li\u003e\n\u003cli\u003eThe site may incorporate deliberate archaic design references.\u003c/li\u003e\n\u003cli\u003eThe tower depended on lost ancillary buildings.\u003c/li\u003e\n\u003cli\u003eThe surrounding earthworks are multi-phase and include possible bailey, garden, water, and siege-related features.\u003c/li\u003e\n\u003cli\u003eWater management and ornamental landscape features are central to understanding the site's medieval setting.\u003c/li\u003e\n\u003cli\u003eThe Civil War episode is not merely a story layer; it may have affected the fabric and earthworks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/section\u003e\n\u003csection id=\"remaining-knowledge-gaps\" class=\"level3\"\u003e\n\u003ch3\u003eRemaining Knowledge Gaps\u003c/h3\u003e\n\u003cp\u003eThe available source base does not include full copies of the Marches Archaeology report, Richard K. Morriss report, Wessex Archaeology Time Team report, consent documents, tender documents, structural-engineering reports, or post-2011 maintenance records.\u003c/p\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection id=\"9-restoration-and-conservation-works\" class=\"level2\"\u003e\n\u003ch2\u003e9. Restoration and Conservation Works\u003c/h2\u003e\n\u003cp\u003eThe works visible in the sources combine masonry conservation, archaeological clearance, limited reconstruction, weatherproofing, access improvements, and interpretation.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eWork Area / Intervention\u003c/th\u003e\n\u003cth\u003ePurpose\u003c/th\u003e\n\u003cth\u003eEvidence\u003c/th\u003e\n\u003cth\u003eNotes / Uncertainties\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003ePurchase of castle and surrounding earthworks\u003c/td\u003e\n\u003ctd\u003eSecure control of monument and context.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCharity Register\u003c/code\u003e; \u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eFiscal Filings\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eFY2009 accounts describe a five-and-a-half-acre curtilage and heritage/capital asset of GBP50,000; transaction terms and boundary plan not provided.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePreparatory professional surveys\u003c/td\u003e\n\u003ctd\u003eEstablish costs, grant case, archaeology, access, and design parameters.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e; \u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eArchaeological Survey\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eFY2006-FY2008 accounts confirm architectural, archaeological, geophysical, interpretative, access, engineering, and quantity-survey categories.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTendering and contractor appointment\u003c/td\u003e\n\u003ctd\u003eSelect repair/access contractor and move from planning into works.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e; \u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eFY2009 accounts say access and repair tenders were invited; FY2010 accounts identify Conservation Building Services of Oswestry as successful tenderer.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePhysical works start\u003c/td\u003e\n\u003ctd\u003eBegin capital conservation and access programme.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eFY2010 accounts state work began in autumn 2009.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHealth and safety/CDM arrangements\u003c/td\u003e\n\u003ctd\u003eManage construction-site and visitor-risk responsibilities.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eFY2010 accounts state contractor building-site insurance was arranged and a CDM responsible for health and safety compliance was appointed; individual not named.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDebris removal from tower\u003c/td\u003e\n\u003ctd\u003eReveal original floor level and enable repair/access.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eRubble volume conflicts: over 200 cubic metres in ChatGPT extraction; over 700 cubic metres in Gemini extraction.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSmall monorail for debris\u003c/td\u003e\n\u003ctd\u003eMove debris without damaging earthworks.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eStrong evidence of earthwork-sensitive logistics; cost unknown.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOriginal floor level and hearths exposed\u003c/td\u003e\n\u003ctd\u003eRecover/interpret buried interior evidence.\u003c/td\u003e\n\u003ctd\u003eChatGPT extraction mentions original floor level of hall and four hearths; Gemini says original floor level buried for centuries.\u003c/td\u003e\n\u003ctd\u003eDetails should be verified against original board or excavation report.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWall-head sealing\u003c/td\u003e\n\u003ctd\u003eProtect masonry from rainwater and weather.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eTechnical specification not in source base.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOriginal stones replaced where possible\u003c/td\u003e\n\u003ctd\u003ePreserve historic fabric.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eExtent and method not quantified.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNew stonework made distinguishable\u003c/td\u003e\n\u003ctd\u003eMaintain conservation legibility between old and new fabric.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eGood conservation principle; technical details not provided.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNew stone arches inserted\u003c/td\u003e\n\u003ctd\u003ePrevent collapse at doorways/windows.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e; \u003ccode\u003eBBC\u003c/code\u003e states English Heritage permitted two arches, one leading to a spiral staircase.\u003c/td\u003e\n\u003ctd\u003eConsent detail limited to \u003ccode\u003eBBC\u003c/code\u003e statement.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePossible Royalist breach hole identified\u003c/td\u003e\n\u003ctd\u003eConnect physical fabric to siege interpretation.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eDescribed as believed/possible; treat as interpretive, not definitive.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eBridge and steps\u003c/td\u003e\n\u003ctd\u003eImprove physical access to the castle.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eBBC\u003c/code\u003e; \u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eDesign/cost/consent not provided.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAccess ramp\u003c/td\u003e\n\u003ctd\u003eSupport visitors with impaired mobility or sight.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e still indicate wheelchair limitations, so ramp did not make the whole site wheelchair-accessible.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCar park\u003c/td\u003e\n\u003ctd\u003eEnable public access.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eCapacity is small: \u003ccode\u003eCastle Website\u003c/code\u003e says 2-3 cars; reviews commonly report 3-6.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInformation board, leaflets, metal story book\u003c/td\u003e\n\u003ctd\u003eInterpret history/restoration and support unstaffed visitor model.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e; \u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eHigh visitor value in reviews.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFenced boundary and safety signage\u003c/td\u003e\n\u003ctd\u003eManage risk at unstaffed site.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e; \u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eCurrent state should be verified on site.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003csection id=\"phasing-and-duration\" class=\"level3\"\u003e\n\u003ch3\u003ePhasing and Duration\u003c/h3\u003e\n\u003cp\u003eThe source base supports a broad sequence rather than a detailed construction programme:\u003c/p\u003e\n\u003col type=\"1\"\u003e\n\u003cli\u003eLocal concern and informal preservation campaign from the mid-1990s.\u003c/li\u003e\n\u003cli\u003eTrust formation and company/charity development from 1995 to 2006.\u003c/li\u003e\n\u003cli\u003eCompany incorporation in 2003 and nil/early accounts before the grant-funded phase.\u003c/li\u003e\n\u003cli\u003eSurveys and analysis around 2005-2008, including official annual-account references to architectural, archaeological, geophysical, interpretative, access, engineering, and quantity-survey work.\u003c/li\u003e\n\u003cli\u003eMajor grant awards and match-funding assembly from FY2006 to FY2010.\u003c/li\u003e\n\u003cli\u003ePurchase completed 15 September 2008.\u003c/li\u003e\n\u003cli\u003eRepair/access tenders invited in FY2009; physical works began in autumn 2009.\u003c/li\u003e\n\u003cli\u003eTime Team visit in June 2009.\u003c/li\u003e\n\u003cli\u003ePeak filed-account expenditure in FY2011 and FY2012, with restoration professional fees of GBP517,616 and GBP217,321 respectively.\u003c/li\u003e\n\u003cli\u003ePublic access from late September 2011.\u003c/li\u003e\n\u003cli\u003eOfficial opening on 1 December 2011.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eThe visible modern project therefore spans roughly the mid-1990s to 2011 if local campaigning is included; the grant-enabled purchase/repair/access phase runs most clearly from FY2006 to FY2012, with ownership secured in 2008 and the largest expenditure appearing in the accounts for FY2011-FY2012.\u003c/p\u003e\n\u003c/section\u003e\n\u003csection id=\"before--after-summary-1\" class=\"level3\"\u003e\n\u003ch3\u003eBefore / After Summary\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eDimension\u003c/th\u003e\n\u003cth\u003eBefore Project\u003c/th\u003e\n\u003cth\u003eAfter Project\u003c/th\u003e\n\u003cth\u003eEvidence\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eStructural safety\u003c/td\u003e\n\u003ctd\u003eRuin at risk of collapse.\u003c/td\u003e\n\u003ctd\u003eStabilised enough for controlled public access to ground-floor/interior areas.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e; \u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e; \u003ccode\u003eBBC\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eConservation legibility\u003c/td\u003e\n\u003ctd\u003eHistoric fabric exposed to decay and collapse.\u003c/td\u003e\n\u003ctd\u003eNew work intentionally distinguishable from old; wall heads sealed.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eArchaeological legibility\u003c/td\u003e\n\u003ctd\u003eFloor buried under rubble; surrounding earthworks under-recognised.\u003c/td\u003e\n\u003ctd\u003eOriginal floor level revealed; earthworks surveyed; interpretation installed.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e; \u003ccode\u003eArchaeological Survey\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVisitor access\u003c/td\u003e\n\u003ctd\u003eNo developed free-access heritage site.\u003c/td\u003e\n\u003ctd\u003eFree unstaffed public access, small car park, bridge, ramp, information.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePublic value\u003c/td\u003e\n\u003ctd\u003eLocal campaign and literary/heritage interest frustrated by poor access.\u003c/td\u003e\n\u003ctd\u003eVisitors consistently praise interpretation, preservation, scenery, and free access.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection id=\"10-project-timeline\" class=\"level2\"\u003e\n\u003ch2\u003e10. Project Timeline\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eYear / Date\u003c/th\u003e\n\u003cth\u003eEvent\u003c/th\u003e\n\u003cth\u003eWhy It Matters\u003c/th\u003e\n\u003cth\u003eSource\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e1066\u003c/td\u003e\n\u003ctd\u003eEadric held Opetoune, Clun, and Hopesay.\u003c/td\u003e\n\u003ctd\u003eEstablishes pre-Norman ownership context.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1086\u003c/td\u003e\n\u003ctd\u003eDomesday-era area held by Roger de Montgomery; Picot de Say as tenant.\u003c/td\u003e\n\u003ctd\u003ePlaces site in post-Conquest Marches context.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1165\u003c/td\u003e\n\u003ctd\u003eWalter de Opton/de Hopton owned the manor.\u003c/td\u003e\n\u003ctd\u003eStart of de Hopton association in source base.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1264\u003c/td\u003e\n\u003ctd\u003eReference to \u003ccode\u003ecastles of Hoptoune\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eEarliest known written reference cited in website notes.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLate 13th / early 14th century\u003c/td\u003e\n\u003ctd\u003eProbable construction date of surviving tower.\u003c/td\u003e\n\u003ctd\u003eCore architectural significance.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eArchaeological Survey\u003c/code\u003e; \u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEarly 17th century\u003c/td\u003e\n\u003ctd\u003eWallop refurbishment and \u003ccode\u003enew brick house\u003c/code\u003e mentioned.\u003c/td\u003e\n\u003ctd\u003eEarly modern modification relevant to siege and earthworks.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eArchaeological Survey\u003c/code\u003e; \u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1644\u003c/td\u003e\n\u003ctd\u003eSiege, surrender, and killing of garrison.\u003c/td\u003e\n\u003ctd\u003eMajor historical significance and interpretation focus.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eArchaeological Survey\u003c/code\u003e; \u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eBBC\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1655\u003c/td\u003e\n\u003ctd\u003eRobert Wallop sold Hopton to Beale family.\u003c/td\u003e\n\u003ctd\u003ePost-siege ownership transition.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1890\u003c/td\u003e\n\u003ctd\u003eBeale estate remnants sold to Sir Edward Ripley.\u003c/td\u003e\n\u003ctd\u003eLater ownership and repair context.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1946\u003c/td\u003e\n\u003ctd\u003eMinistry of Works inspector requested fence against cattle damage.\u003c/td\u003e\n\u003ctd\u003eEvidence of 20th-century concern and limited action.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMid-1950s\u003c/td\u003e\n\u003ctd\u003eSold to Williams family; danger raised with Ministry of Works.\u003c/td\u003e\n\u003ctd\u003eImmediate pre-Trust private ownership context.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1950s-1960s\u003c/td\u003e\n\u003ctd\u003eMinor repairs kept monument standing.\u003c/td\u003e\n\u003ctd\u003ePre-modern project stabilisation, but insufficient long-term rescue.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMid-1990s\u003c/td\u003e\n\u003ctd\u003eLocal preservation cause revived.\u003c/td\u003e\n\u003ctd\u003eStart of modern rescue pathway.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1995\u003c/td\u003e\n\u003ctd\u003eTrust formed informally.\u003c/td\u003e\n\u003ctd\u003eBeginning of organised preservation vehicle.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1997\u003c/td\u003e\n\u003ctd\u003eTrust became company limited by guarantee.\u003c/td\u003e\n\u003ctd\u003eFormal governance development.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e25 March 2003\u003c/td\u003e\n\u003ctd\u003eHopton Castle Preservation Trust incorporated as company number \u003ccode\u003e04710194\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eConfirms legal vehicle before charity registration and capital rescue.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCompanies House\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFY2005\u003c/td\u003e\n\u003ctd\u003eFiled accounts show nil income, expenditure, assets, and cash.\u003c/td\u003e\n\u003ctd\u003eIndicates minimal/dormant company finances before major project grants.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSeptember 2005\u003c/td\u003e\n\u003ctd\u003eEnglish Heritage earthworks survey.\u003c/td\u003e\n\u003ctd\u003eKey archaeological baseline.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eArchaeological Survey\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFY2006\u003c/td\u003e\n\u003ctd\u003eRecognised restricted grant income of GBP50,000 split between HLF GBP45,000 and SCC GBP5,000; preparatory survey categories recorded.\u003c/td\u003e\n\u003ctd\u003eOfficial accounts clarify early project-planning finance.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2006\u003c/td\u003e\n\u003ctd\u003eMore than GBP1m secured from HLF and other sources.\u003c/td\u003e\n\u003ctd\u003eCapital project made possible.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e; \u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e25 September 2006\u003c/td\u003e\n\u003ctd\u003eCharity registration date.\u003c/td\u003e\n\u003ctd\u003eCurrent charity status begins.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCharity Register\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFY2007\u003c/td\u003e\n\u003ctd\u003eHLF GBP880,000 and English Heritage GBP150,000 bids recorded as successful.\u003c/td\u003e\n\u003ctd\u003eMajor capital award evidence from filed accounts.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDecember 2007\u003c/td\u003e\n\u003ctd\u003eInitial site surveys by architects, quantity surveyors, and engineers completed.\u003c/td\u003e\n\u003ctd\u003ePrecondition for final approval of major grants.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFY2008\u003c/td\u003e\n\u003ctd\u003eAdditional successful bids recorded: AHF GBP6,000, SCC Economic Regeneration Team GBP33,000, AONB SDF GBP4,000, SSDC GBP25,000, Leverhulme Trust GBP3,000.\u003c/td\u003e\n\u003ctd\u003eShows breadth of match/support funding.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15 September 2008\u003c/td\u003e\n\u003ctd\u003ePurchase completed.\u003c/td\u003e\n\u003ctd\u003eTrust secured the monument and surrounding earthworks.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCharity Register\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFY2009\u003c/td\u003e\n\u003ctd\u003eAccounts record purchase of the castle and five-and-a-half-acre curtilage, invitation of access/repair tenders, and public-liability insurance after ownership.\u003c/td\u003e\n\u003ctd\u003eTurns acquisition into an official accounts milestone.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJune 2009\u003c/td\u003e\n\u003ctd\u003eTime Team visit.\u003c/td\u003e\n\u003ctd\u003eAdded archaeology/public visibility.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAutumn 2009\u003c/td\u003e\n\u003ctd\u003eWork on the castle began.\u003c/td\u003e\n\u003ctd\u003eStart of physical conservation works.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFY2010\u003c/td\u003e\n\u003ctd\u003eConservation Building Services of Oswestry identified as successful tenderer; Leader Fund GBP30,000 and Shropshire Council LJC GBP10,000 recorded; matching funding achieved.\u003c/td\u003e\n\u003ctd\u003eShows contractor appointment and late match-funding close.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFY2011\u003c/td\u003e\n\u003ctd\u003eFiled accounts record total income GBP489,148 and expenditure GBP519,635, including GBP517,616 professional fees for castle restoration.\u003c/td\u003e\n\u003ctd\u003ePeak restoration expenditure in source base.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFY2012\u003c/td\u003e\n\u003ctd\u003eFiled accounts record total income GBP284,000 and expenditure GBP219,092, including GBP217,321 professional fees for castle restoration.\u003c/td\u003e\n\u003ctd\u003eMajor works expenditure continues through opening period.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEnd September 2011\u003c/td\u003e\n\u003ctd\u003ePublic access provided.\u003c/td\u003e\n\u003ctd\u003eTransition from rescue project to public heritage site.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOctober 2011\u003c/td\u003e\n\u003ctd\u003eWorks scheduled for completion.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCharity Register\u003c/code\u003e completion target.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCharity Register\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e1 December 2011\u003c/td\u003e\n\u003ctd\u003eOfficial opening by Duke of Gloucester.\u003c/td\u003e\n\u003ctd\u003ePublic completion marker.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eBBC\u003c/code\u003e; \u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFY2013-FY2016\u003c/td\u003e\n\u003ctd\u003eAccounts show lower but continuing expenditure and regular reports of large visitor numbers.\u003c/td\u003e\n\u003ctd\u003eTransition from capital project to maintained public-access site.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFY2018 onward\u003c/td\u003e\n\u003ctd\u003eAccounts repeatedly describe free access and visitor groups including families, cyclists, walkers, and occasional groups.\u003c/td\u003e\n\u003ctd\u003eOfficial annual-report corroboration of visitor model.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e31 March 2025\u003c/td\u003e\n\u003ctd\u003eLatest financial-year snapshot in source base.\u003c/td\u003e\n\u003ctd\u003eShows current small-scale operating model.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCharity Register\u003c/code\u003e; \u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e18 September 2025\u003c/td\u003e\n\u003ctd\u003eFY2025 trustees' report approved and signed by J W George.\u003c/td\u003e\n\u003ctd\u003eLatest filed-account governance marker in clean source base.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e25 September 2025\u003c/td\u003e\n\u003ctd\u003eMichael John Lynskey appointed director; Jennifer Mary Marquis resigned as director in company-register compilatio
