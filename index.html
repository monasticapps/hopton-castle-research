ure, and siege context survey. Crucial for protecting and interpreting the broader site beyond the tower. Companies House trustee report notes on preparatory surveys FY2006 FY2008 FY2006 notes project manager coordination of architectural, archaeological, geophysical, interpretative, and access surveys; FY2007 notes architectural, archaeological, engineering, and quantity surveys; FY2008 says initial surveys by architects, quantity surveyors, and engineers were completed by December 2007. Provides official annual report confirmation that survey work was a prerequisite to grant approval and restoration planning. Richard K. Morriss Associates, archaeological and architectural analysis 2006 Tower fabric, construction, layout, condition, floor, and reconstruction evidence, as summarised in website notes. Informed repair/conservation decisions and interpretation. Time Team / Wessex Archaeology June 2009 and subsequent report/programme Three day dig; finds included Roman coin, human tooth, cannon ball, gold James I quarter laurel; programme focused on siege but found medieval evidence. Added public visibility and archaeological knowledge, but source base lacks the full Wessex report. The research base was unusually important for a small ruin because the project needed to justify purchase, funding, and intervention. Castle Website says the Trust raised funds for two initial surveys to support bids for purchase and rescue, and English Heritage commissioned the earthworks survey. Specialist knowledge from Jeff George, Peter Curnow, Sula Rayska, Richard Morriss, and others appears to have shaped the project. Main Knowledge Contributions The tower is probably a high status residence rather than a conventional keep. The site may incorporate deliberate archaic design references. The tower depended on lost ancillary buildings. The surrounding earthworks are multi phase and include possible bailey, garden, water, and siege related features. Water management and ornamental landscape features are central to understanding the site's medieval setting. The Civil War episode is not merely a story layer; it may have affected the fabric and earthworks. Remaining Knowledge Gaps The available source base does not include full copies of the Marches Archaeology report, Richard K. Morriss report, Wessex Archaeology Time Team report, consent documents, tender documents, structural engineering reports, or post 2011 maintenance records. 9. Restoration and Conservation Works The works visible in the sources combine masonry conservation, archaeological clearance, limited reconstruction, weatherproofing, access improvements, and interpretation. Work Area / Intervention Purpose Evidence Notes / Uncertainties Purchase of castle and surrounding earthworks Secure control of monument and context. Charity Register ; Castle Website ; Fiscal Filings . FY2009 accounts describe a five and a half acre curtilage and heritage/capital asset of GBP50,000; transaction terms and boundary plan not provided. Preparatory professional surveys Establish costs, grant case, archaeology, access, and design parameters. Fiscal Filings ; Castle Website ; Archaeological Survey . FY2006 FY2008 accounts confirm architectural, archaeological, geophysical, interpretative, access, engineering, and quantity survey categories. Tendering and contractor appointment Select repair/access contractor and move from planning into works. Fiscal Filings ; Castle Website . FY2009 accounts say access and repair tenders were invited; FY2010 accounts identify Conservation Building Services of Oswestry as successful tenderer. Physical works start Begin capital conservation and access programme. Fiscal Filings . FY2010 accounts state work began in autumn 2009. Health and safety/CDM arrangements Manage construction site and visitor risk responsibilities. Fiscal Filings . FY2010 accounts state contractor building site insurance was arranged and a CDM responsible for health and safety compliance was appointed; ind r/trustee signal Jeffrey/Jeffery William George Charity Register ; Companies House ; Fiscal Filings . Name spelling varies slightly by source; FY2025 accounts say report signed by J W George. Current charity trustees Valerie Kathleen George; Michael John Lynskey; Ann Elizabeth Buchanan Jackson; Charles Franklin Jackson; Jane Elizabeth Lynda Price; Duncan Price; Robert Rollason; Katherine Rollason; Mary Bason; Robert Bates; Jonathan Dean; Edward Roy Laidlar; Professor Peter Michael Marquis Charity Register . Charity register style data; compare with Companies House because charity trustees and company directors may be presented differently. Historical officer register 52 total registered officers; 37 resigned officers. Companies House . Useful for governance timeline, continuity, and trustee/director turnover. Patrons, website era Mr Heber Percy; Philip Dunne MP; Lord John Julius Norwich Castle Website . Patron data may be historic. Missing roles Structural engineer, quantity surveyor, legal services, tender/procurement manager Not identified in current source base. Research gap; compare with Barholm/Ightham case study roles. The named team is strong for project management, conservation building, archaeology, architecture, funding, and current officer/trustee identification. It is weaker in the available source base for procurement mechanics, contract values, legal acquisition services, and named quantity surveying or structural engineering personnel. The annual accounts confirm that quantity surveyors and engineers attended project meetings, but do not name them. 13. Current Use, Visitor Experience, and Public Access Hopton Castle is currently used as a free, unstaffed public heritage ruin with interpretation. It is not a staffed attraction, residence, commercial venue, or full day destination. The charity's object is public preservation of historical, architectural, and constructional heritage in and around Hopton Castle. Official Access and Safety Castle Website says visitor improvements included parking for 2 or 3 cars, an improved bridge, an information board, and an access ramp for visitors with impaired mobility or sight. It states there are no toilet facilities at the castle, nearest public toilets are in Clun, the village has no pubs, shops, or public transport, and the entry lanes are single track. Infographic 1 / Infographic 2 state that the castle and grounds are unstaffed and entry is at the visitor's own risk. Listed hazards include uneven surfaces and grounds, reduced head height/light/access, unfenced pond, loose livestock/manure, and self closing gates. The board also asks visitors not to climb on the castle, notes that there are no services, advises daylight viewing from 09.00 to 16.00, asks visitors to stay within the fenced boundary, lock cars, park at owner's risk, and take litter home. Visitor Experience Themes Theme Visitor Evidence Operational Implication Short visit / stop off Google Reviews and TripAdvisor Reviews repeatedly describe the site as small, a quick visit, half hour stop, or worth seeing if nearby. Best positioned as part of a wider itinerary, not a standalone day out. Free access and parking Google Reviews / TripAdvisor Reviews repeatedly praise free entry and free parking. Free model is valued; donation asks should remain low friction and clearly linked to upkeep. Donations accepted as fair Google Reviews / TripAdvisor Reviews mention donation box, bank transfer, scannable code, and voluntary upkeep donations. Strong case for visible donation routes and updated signage/payment options. Limited parking Castle Website says 2 3 cars; Google Reviews / TripAdvisor Reviews mention 3 4, 4 5, or 5 6 spaces and occasional parking conflict. Carrying capacity is low; marketing should avoid generating unmanaged surges. No services Google Reviews / TripAdvisor Reviews and official guidance note no toilets, cafe, shop, bins, or guides. Visitor expectations must be managed; nearby facilities can be signposted digitally or in leaflets. Interpretation quality Google Reviews / TripAdvisor Reviews consistently praise information boards, storyboards, leaflets, and metal story book. Interpretation is a major value driver and should be maintained/refreshed. Civil War story Google Reviews / TripAdvisor Reviews often cite the siege, massacre, Time Team, and dark history as memorable. Strong basis for educational content and trail integration. Accessibility constraints Google Reviews / TripAdvisor Reviews mention ground floor only access, steps, uneven ground, and wheelchair difficulty. Accessibility should be assessed honestly; ramp does not equal full wheelchair access. Rural route difficulty TripAdvisor Reviews mention hidden/off road location, narrow roads, GPS/signage issues, and weak bridge/car only bridge. Clear approach guidance matters; avoid assuming all visitors are comfortable on narrow lanes. Family/dog/picnic use Google Reviews / TripAdvisor Reviews mention children, dogs, picnics, benches/tables, and quiet open space. Low impact family/outdoor use fits current site character. Landscape and nature Google Reviews / TripAdvisor Reviews mention scenery, snowdrops, swallows/swifts, red kite, birds, stargazing, dark skies, and photography. Potential for seasonal/dark sky/nature sensitive interpretation, subject to evidence and conservation constraints. Nearby bundling Google Reviews / TripAdvisor Reviews mention Clun, Ludlow, Hopton Heath, walks, other castles, railway, and local stays. Strong opportunity for regional trail and itinerary partnerships. Visitor Model Assessment The visitor model works because expectations are modest and interpretation is strong. People do not generally expect a large staffed castle; they value the site as a free, peaceful, well maintained ruin with a compelling story. The main operational risk is mismatch: visitors who expect a larger attraction, more facilities, or easy accessibility may be disappointed. The site is best framed as a quiet heritage stop requiring self sufficient visitors. 14. Future Opportunities and Constraints Opportunity Supporting Evidence Constraint / Risk Practical Next Step Donation optimisation Google Reviews / TripAdvisor Reviews already mention donation box, bank transfer, and scannable code; FY2025 accounts show donations of GBP2,636 and total income of GBP2,658. Must not make free access feel transactional; payment routes must be maintained. Audit current donation signage, online giving, QR code, and explanation of annual upkeep costs. Interpretation refresh Google Reviews / TripAdvisor Reviews strongly value boards, leaflets, and metal story book. Outdoor interpretation weathers; overloading boards can reduce clarity. Review condition and content of current panels; add digital companion content for deeper layers. Civil War education Siege story is a major visitor memory; sources are rich. Violent history needs careful, factual handling. Build a concise education pack or digital trail using Samuel More, Time Team, and site features. Earthworks/water landscape interpretation Archaeological Survey shows rich landscape features; reviews focus more on tower and boards. Earthworks are subtle and archaeologically sensitive. Develop low impact map/AR/audio interpretation rather than intrusive physical works. Volunteer learning visits Pendragon team interest includes volunteer experience; Hopton has visible conservation outcomes. Site is unstaffed and small; visits need coordination with Trust. Approach Trust for supervised learning day focused on conservation choices and maintenance. Regional castle trail Castle Website and Google Reviews / TripAdvisor Reviews connect Hopton with Clun, Ludlow, Stokesay, Croft, Brampton Bryan, and Welsh Marches castles. Parking and lane capacity limit high volume promotion. Frame as dispersed itinerary, not mass event; coordinate with nearby attractions/facilities. Walking/cycling integration Google Reviews / TripAdvisor Reviews mention walkers, cyclists, Hopton Heath, Warfield Bank, forest car park, and countryside stops. Narrow roads and limited parking; safety concerns. Produce route guidance and public transport caveats; verify rights of way and current access. Digital engagement Time Team, literary links, archaeology, and maps are strong content pools. Requires ongoing maintenance and permissions for media. Create source cited web/PDF guide or QR linked page rather than new on site infrastructure. Schools/literary trail Castle Website notes Kevin Crossley Holland's Arthur trilogy and possible school/tourism materials. Literary material may be secondary to conservation goals; rights/permissions may apply. Reassess school pack potential with Trust and local libraries/tourism bodies. Dark sky / photography angle Google Reviews / TripAdvisor Reviews mention Milky Way, clear skies, sunsets, and photography. Official board says daylight viewing 09.00 16.00; night access may conflict with safety. Verify current access rules before promoting any dark sky use. Ecology/wildlife framing Google Reviews / TripAdvisor Reviews mention birds, red kite, snowdrops, livestock, rural setting; AONB context is strong. No formal ecology survey or sanctuary proposal in source base. Treat as interpretive/environmental context until ecological constraints/opportunities are researched. Maintenance funding case Castle Website estimated GBP3,000 annual maintenance/insurance need; recent filed accounts show annual expenditure of GBP2,193 in FY2025, GBP2,610 in FY2024, and GBP3,093 in FY2023. Need current cost categories before fundraising claims; total funds include restricted funds and the heritage asset, not just flexible cash. Ask Trust for current annual maintenance, insurance, inspection, restricted fund policy, and donation figures. Constraints Protected status means future physical intervention likely requires heritage consent. The car park is very small and the approach lanes are narrow. The site is unstaffed and has no toilets, cafe, shop, bins, or guides. Accessibility is limited by uneven ground, steps, reduced head height/light, and mound/ruin conditions. Current unrestricted income appears modest relative to even small maintenance needs; FY2025 unrestricted funds were GBP10,731. Archaeological earthworks and water features are part of the asset and must not be harmed by visitor improvements. The site's public value partly depends on its quiet, rural character; over commercialisation would conflict with visitor sentiment and site capacity. The strongest future direction is not commercial intensification. It is a conservation compatible support model: better donation pathways, clearer digital interpretation, regional itinerary integration, volunteer/education use, and careful maintenance of existing access. 15. Final Takeaways for Pendragon Foundation Hopton Castle is a useful model for rescuing a small ruined castle without forcing it into a residential or high commercial use. Its success appears to have come from a strong public benefit case, local campaigning, expert archaeological and conservation input, major grant funding, and a realistic end state: stabilised ruin, protected fabric, visitor access, and interpretation. The Companies House accounts now show the financial shape of that transition: a capital project with six figure annual income/expenditure in FY2011 FY2012, followed by a much smaller stewardship charity whose ordinary income is usually measured in low thousands. On the evidence available, the apparent objectives were largely achieved. The Trust bought the castle and surrounding earthworks, repaired and conserved the monument, made it available to the public, installed interpretation, and secured strong visitor appreciation. The current site is widely perceived as well maintained and worthwhile despite being small and unstaffed. The core caution is sustainability. Capital rescue funding solved the immediate collapse/access problem, but recent finance shows a small charity operating on modest unrestricted income, with restricted funds and a heritage asset making up much of the balance sheet position. For Pendragon, the lesson is that any restoration feasibility study must separate capital rescue from long term stewardship. The practical follow up should focus on current maintenance costs, consent constraints, title/boundary data, donation performance, restricted fund use, and whether the Trust has specific priorities where Pendragon support would be useful. Appendix A: Source Reliability Notes Source Best Use Caution Charity Register Current/recent charity status, trustees, finance, contact, legal form. Does not explain restoration narrative in depth; recent finance is post capital project. Companies House Companies House company identity, SIC code, filing deadlines, current active officers, and historical officer appointments/resignations. Company register data can differ from charity register presentation; address data should be checked against the latest live record before external use. Fiscal Filings Filed annual accounts, year by year income/expenditure/funds, restoration era trustee report notes, professional fee totals, related party reimbursements, fund movements. Clean summaries are OCR derived; older FY2005 FY2010 accounts are less normalized and should be checked against PDFs for accounting critical use. Castle Website Broad website synthesis across history, access, funding, team, Time Team, contacts. Some trustee/contact details are website era and superseded by Charity Register . Archaeological Survey Specialist archaeology, earthworks, landscape, water features, siege appendix. Predates 2011 opening and later restoration outcomes. BBC External confirmation of 2011 opening, GBP1m restoration, English Heritage arch permission. Short news summary, not a technical or financial report. Infographic 1 On site board content, funders, safety, conservation messaging. AI extraction from weathered/angled photo; inclu Council shropshire.gov.uk Historic local authority; FY2008 accounts record a successful GBP25,000 bid. Heritage Lottery Fund / National Lottery Heritage Fund heritagefund.org.uk Main capital funder; website notes report GBP880,000 largest grant. Historic England historicengland.org.uk Not directly represented as a local source body, but likely modern route for list/schedule/consent verification. Hopton Castle Preservation Trust / HCPT hoptoncastle.org.uk Owner/operator and restoration delivery charity/company. Millichope Foundation Charity Commission register Private/philanthropic supporter named in interpretation board extraction; amount not itemised. Ministry of Works No current standalone site; historic UK government department Mid 20th century inspection/minor repair context in website history. Richard K. Morriss and Associates No verified current standalone website identified Archaeological and architectural analysis source named by website notes. Rural Development Programme for England gov.uk/rural development programme for england Rural development support context for board listed funders. Shropshire Council shropshire.gov.uk Local authority and funding channel; FY2010 accounts record Leader/LJC support via Shropshire Council. Shropshire Council Local Joint Committee shropshire.gov.uk Local joint committee funding; accounts record GBP10,000 and later GBP2,500 contributions. Shropshire County Council shropshire.gov.uk Historic county council support; accounts record SCC related early and economic regeneration funding. Shropshire Hills AONB Partnership / Shropshire Hills National Landscape shropshirehills nl.org.uk Landscape/cultural heritage context and supporter named in website/board evidence. Shropshire Hills LEADER Local Action Group shropshire.gov.uk Rural development/local action support; FY2010 accounts record GBP30,000 Leader Fund via Shropshire Council. Shropshire Hills Sustainable Development Fund shropshirehills nl.org.uk FY2008 accounts record AONB SDF bid of GBP4,000. Shropshire Tourism Action Plan No current standalone site identified; see Shropshire Council Tourism related support named in interpretation board extraction; amount not itemised. The Leverhulme Trust leverhulme.ac.uk FY2008 accounts list GBP3,000 contribution/support. Time Team timeteamdigital.com Public archaeology/media project; visited Hopton in June 2009 according to website notes. Wessex Archaeology wessexarch.co.uk Archaeology body associated with the Time Team report/work referenced in website notes. Appendix C: Evidence Gaps and Further Research Questions Gap / Question Why It Matters Likely Next Source or Action Full consent pathway Needed to understand regulatory process and future intervention constraints. Historic England records; local planning authority; Trust archive. Scheduled Monument entry and exact Grade I listing details Current source base states status but does not include official entries. Historic England official list/schedule records. Purchase consideration and transaction terms Accounts carry the heritage/capital asset at GBP50,000, but the source base does not show conveyance terms or explicitly reconcile carrying value to full purchase consideration. Trust archive; conveyancing records if accessible; Land Registry/title documents. Ownership boundary FY2009 accounts give a five and a half acre curtilage, but no mapped boundary. Land Registry; Trust property records; site plan. Detailed capital budget Filed accounts now show annual income/expenditure and major professional fee totals, but not technical cost drivers. HLF project file; Trust archive; final project report. Phase by phase cost schedule Needed to compare with Ightham/Barholm style case studies and understand which costs attached to masonry, access, archaeology, interpretation, and preliminaries. Quantity surveyor/project manager records; grant claims. Tender/procurement process Needed to understand contractor selection and project delivery. Trust minutes; /conservation claims. Ecology survey; AONB/local biodiversity records. Future archaeology plans Castle Website notes hope for further work, but current status unknown. Trust/Historic England/Wessex Archaeology follow up. Appendix D: Visitor Review Theme Index Theme Source Signal Strong positives Peaceful, scenic, well maintained, interesting history, excellent boards, free access. Common use case Short stop, half hour visit, picnic, dog/family walk, castle trail, local stay add on. Practical limits Small car park, no toilets, no cafe/shop, no bins, no guides, narrow lanes. Access limits Uneven ground, steps, ground floor only access, wheelchair difficulty. Donation signals Donation box, scannable code, bank transfer, voluntary upkeep support. Interpretation signals Storyboards, free leaflets, metal book, Time Team references, Civil War story. Partnership signals Clun, Ludlow, Stokesay, Hopton Heath, walks, Shropshire Hills, other castles. Nature/landscape signals Snowdrops, birds, swallows/swifts, red kite, dark skies, stargazing, photography."}</script>
<script>(function clientApp() {
  const data = JSON.parse(document.getElementById('report-data').textContent);
  const article = document.getElementById('article');
  const tocNav = document.getElementById('tocNav');
  const searchInput = document.getElementById('searchInput');
  const searchMeta = document.getElementById('searchMeta');
  const hitNav = document.getElementById('hitNav');
  const prevHit = document.getElementById('prevHit');
  const nextHit = document.getElementById('nextHit');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxTitle = document.getElementById('lightboxTitle');
  const lightboxCounter = document.getElementById('lightboxCounter');
  const lightboxClose = document.getElementById('lightboxClose');
  const lightboxPrev = document.getElementById('lightboxPrev');
  const lightboxNext = document.getElementById('lightboxNext');
  let hits = [];
  let hitIndex = -1;
  let gallery = [];
  let galleryIndex = -1;
  article.innerHTML = data.html;
  function buildToc() {
    const heads = [...article.querySelectorAll('h2, h3, h4')];
    tocNav.innerHTML = '';
    let group = -1;
    const groupCounts = [];
    const rows = [];
    heads.forEach((h, idx) => {
      if (!h.id) h.id = 'section-' + idx;
      if (h.tagName === 'H2') {
        group += 1;
        groupCounts[group] = 0;
      } else if (group >= 0) {
        groupCounts[group] += 1;
      }
      rows.push({ h, group, level: Number(h.tagName.slice(1)) });
    });
    rows.forEach(({ h, group, level }) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'toc-link level-' + level;
      b.dataset.group = String(group);
      const label = document.createElement('span');
      label.className = 'toc-label';
      label.textContent = h.textContent;
      b.appendChild(label);
      if (level === 2 && groupCounts[group] > 0) {
        const arrow = document.createElement('span');
        arrow.className = 'toc-arrow';
        arrow.textContent = '▾';
        arrow.title = 'Collapse section';
        arrow.addEventListener('click', event => {
          event.stopPropagation();
          toggleGroup(group, arrow);
        });
        b.appendChild(arrow);
      }
      b.addEventListener('click', () => h.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      tocNav.appendChild(b);
    });
  }
  function toggleGroup(group, arrow) {
    const children = [...tocNav.querySelectorAll(`.toc-link[data-group="${group}"]`)].filter(el => !el.classList.contains('level-2'));
    const collapsed = children.some(el => !el.hidden);
    children.forEach(el => { el.hidden = collapsed; });
    arrow.textContent = collapsed ? '▸' : '▾';
    arrow.title = collapsed ? 'Expand section' : 'Collapse section';
  }
  function clearMarks() {
    article.querySelectorAll('mark.search-hit').forEach(mark => mark.replaceWith(document.createTextNode(mark.textContent)));
    article.normalize();
    hits = [];
    hitIndex = -1;
    hitNav.hidden = true;
  }
  function updateHitPosition() {
    hits.forEach(h => h.classList.remove('active-hit'));
    if (!hits.length || hitIndex < 0) return;
    const hit = hits[hitIndex];
    hit.classList.add('active-hit');
    hit.scrollIntoView({ behavior: 'smooth', block: 'center' });
    searchMeta.textContent = `${hits.length} match${hits.length === 1 ? '' : 'es'} · ${hitIndex + 1} of ${hits.length}`;
  }
  function gotoHit(delta) {
    if (!hits.length) return;
    hitIndex = (hitIndex + delta + hits.length) % hits.length;
    updateHitPosition();
  }
  function highlight(query) {
    clearMarks();
    if (!query || query.length < 2) {
      searchMeta.textContent = 'Type 2+ characters to search this report.';
      return;
    }
    const q = query.toLowerCase();
    const walker = document.createTreeWalker(article, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        const parent = node.parentElement;
        if (!parent || ['SCRIPT', 'STYLE', 'MARK'].includes(parent.tagName)) return NodeFilter.FILTER_REJECT;
        return node.nodeValue.toLowerCase().includes(q) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
      }
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      const text = node.nodeValue;
      const lower = text.toLowerCase();
      const frag = document.createDocumentFragment();
      let pos = 0;
      let idx;
      while ((idx = lower.indexOf(q, pos)) >= 0) {
        frag.appendChild(document.createTextNode(text.slice(pos, idx)));
        const mark = document.createElement('mark');
        mark.className = 'search-hit';
        mark.textContent = text.slice(idx, idx + query.length);
        frag.appendChild(mark);
        pos = idx + query.length;
      }
      frag.appendChild(document.createTextNode(text.slice(pos)));
      node.parentNode.replaceChild(frag, node);
    });
    hits = [...article.querySelectorAll('mark.search-hit')];
    if (!hits.length) {
      searchMeta.textContent = 'No matches.';
      hitNav.hidden = true;
      return;
    }
    hitNav.hidden = false;
    hitIndex = 0;
    updateHitPosition();
  }
  function buildGallery() {
    gallery = [...article.querySelectorAll('img')].map((img, index) => {
      const link = img.closest('a[href]');
      const figure = img.closest('figure');
      const caption = figure ? figure.querySelector('figcaption') : null;
      return { src: link ? link.getAttribute('href') : img.getAttribute('src'), title: (caption && caption.textContent.trim()) || img.getAttribute('alt') || `Image ${index + 1}`, img };
    });
    gallery.forEach((item, index) => {
      const link = item.img.closest('a[href]');
      const handler = event => { event.preventDefault(); openLightbox(index); };
      item.img.addEventListener('click', handler);
      if (link) link.addEventListener('click', handler);
    });
  }
  function openLightbox(index) {
    if (!gallery.length) return;
    galleryIndex = (index + gallery.length) % gallery.length;
    const item = gallery[galleryIndex];
    lightboxImg.src = item.src;
    lightboxImg.alt = item.title;
    lightboxTitle.textContent = item.title;
    lightboxCounter.textContent = `${galleryIndex + 1} of ${gallery.length}`;
    lightbox.classList.add('open');
  }
  function closeLightbox() { lightbox.classList.remove('open'); lightboxImg.removeAttribute('src'); }
  function stepLightbox(delta) { if (lightbox.classList.contains('open')) openLightbox(galleryIndex + delta); }
  searchInput.addEventListener('input', () => highlight(searchInput.value.trim()));
  prevHit.addEventListener('click', () => gotoHit(-1));
  nextHit.addEventListener('click', () => gotoHit(1));
  lightboxClose.addEventListener('click', closeLightbox);
  lightboxPrev.addEventListener('click', () => stepLightbox(-1));
  lightboxNext.addEventListener('click', () => stepLightbox(1));
  lightbox.addEventListener('click', event => { if (event.target === lightbox) closeLightbox(); });
  window.addEventListener('keydown', event => {
    if (lightbox.classList.contains('open')) {
      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'ArrowLeft') stepLightbox(-1);
      if (event.key === 'ArrowRight') stepLightbox(1);
      return;
    }
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'f') { event.preventDefault(); searchInput.focus(); searchInput.select(); }
  });
  buildToc();
  buildGallery();
})();</script>
