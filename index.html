ied in source base.\u003c/td\u003e\n\u003ctd\u003eFY2009 accounts record Hopton Day raising almost GBP700, over GBP2,500 raised within the village, and GBP435 from radio/television-linked donations; \u003ccode\u003eCastle Website\u003c/code\u003e notes local opening-day sponsorship.\u003c/td\u003e\n\u003ctd\u003eLocal support, fundraising, publicity, and in-kind contribution.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e; \u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eSeveral names in this table are historic programme, committee, or council names rather than current independent organisations. Where no current standalone site was identified, the website column points to the current parent, successor, or official register page.\u003c/p\u003e\n\u003cp\u003eThe source base consistently presents the capital restoration as a GBP1m-plus rescue. The Companies House accounts now provide annual filed-account figures and key trustee-report notes, but they still do not provide a phase-by-phase capital budget, tender price schedule, grant-claim file, or line-item technical cost plan.\u003c/p\u003e\n\u003c/section\u003e\n\u003csection id=\"filed-account-financial-trajectory\" class=\"level3\"\u003e\n\u003ch3\u003eFiled-Account Financial Trajectory\u003c/h3\u003e\n\u003cp\u003eThe annual accounts clarify three phases: pre-capital setup, capital acquisition/repair, and low-income stewardship. Older scanned accounts are less fully normalized than FY2011 onward, so use FY2005-FY2010 with the cautions in the account summaries.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eFY\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003eIncome / Inflow Evidence\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003eExpenditure Evidence\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003eEnd Position / Funds Evidence\u003c/th e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAbout GBP250,000\u003c/td\u003e\n\u003ctd\u003eEnglish Heritage contribution in \u003ccode\u003eCastle Website\u003c/code\u003e; likely includes wider contribution beyond the GBP150,000 initial bid, but the source base should not force reconciliation.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGBP50,000\u003c/td\u003e\n\u003ctd\u003eHeritage/capital asset value carried in accounts from acquisition period onward.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGBP517,616\u003c/td\u003e\n\u003ctd\u003eFY2011 professional fees for castle restoration.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGBP217,321\u003c/td\u003e\n\u003ctd\u003eFY2012 professional fees for castle restoration.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAround GBP3,000 annually\u003c/td\u003e\n\u003ctd\u003eWebsite-era estimate of annual maintenance and insurance need after major funding ended.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGBP17,000\u003c/td\u003e\n\u003ctd\u003eMid-20th-century estimated repair cost that could not be afforded.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/section\u003e\n\u003csection id=\"current-charity-finance\" class=\"level3\"\u003e\n\u003ch3\u003eCurrent Charity Finance\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eFinancial Year Ending\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003eIncome\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003eExpenditure\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003eFunds Carried Forward\u003c/th\u003e\n\u003cth\u003eNotes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e31/03/2021\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003eGBP1,955\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003eGBP3,640\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003eGBP84,136\u003c/td\u003e\n\u003ctd\u003eDonations and legacies only; restricted funds continued to draw down.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e31/03/2022\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003eGBP8,125\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003eGBP4,134\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003eGBP88,127\u003c/td\u003e\n\u003ctd\u003eIncome outlier; donations GBP7,124 and grants GBP1,001.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e31/03/2023\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003eGBP2,926\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003eGBP3,093\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003eGBP87,960\u003c/td\u003e\n\u003ctd\u003eDonations GBP2,874; small investment income.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e31/03/2024\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003eGBP1,730\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003eGBP2,610\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003eGBP87,080\u003c/td\u003e\n\u003ctd\u003eDonations GBP1,591; investment income GBP139.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e31/03/2025\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003eGBP2,658\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003eGBP2,193\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003eGBP87,545\u003c/td\u003e\n\u003ctd\u003eDonations GBP2,636; deposit interest GBP22; English Heritage restricted fund moved from GBP25,206 to GBP24,314 after GBP892 expenditure.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe current financial pattern is very different from the capital project. Hopton now operates as a small, low-income charity managing a conserved ruin, not as a grant-rich capital restoration programme. The accounts also show that total funds are not the same as immediately spendable unrestricted cash: FY2025 total funds are GBP87,545, but unrestricted funds are GBP10,731 and restricted funds are GBP76,814, including the GBP50,000 heritage asset.\u003c/p\u003e\n\u003c/section\u003e\n\u003csection id=\"governance-and-related-party-expense-notes\" class=\"level3\"\u003e\n\u003ch3\u003eGovernance and Related-Party Expense Notes\u003c/h3\u003e\n\u003cp\u003eThe Companies House accounts add hard governance/payment details that were not visible in the earlier report. Related-party reimbursements are small and mostly administrative rather than remuneration, but they are useful for tracking who carried practical administrative work:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eFY\u003c/th\u003e\n\u003cth\u003eReimbursed Trustee Expense Evidence\u003c/th\u003e\n\u003cth\u003eSource\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e2011\u003c/td\u003e\n\u003ctd\u003eMr T Baker GBP209; 2010 comparative GBP272.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2012\u003c/td\u003e\n\u003ctd\u003eMr T Baker GBP87; 2011 comparative GBP209.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2013\u003c/td\u003e\n\u003ctd\u003eMr T Baker GBP193; 2012 comparative GBP87.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2014\u003c/td\u003e\n\u003ctd\u003eMr T Baker GBP123; 2013 comparative GBP193.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2015\u003c/td\u003e\n\u003ctd\u003eMr T Baker GBP65; Mr E Laidlar GBP20.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2016\u003c/td\u003e\n\u003ctd\u003eE Laidlar GBP0; 2015 comparative GBP20.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2017\u003c/td\u003e\n\u003ctd\u003eNo reimbursed trustee expenses in FY2017 or FY2016 comparative.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2018\u003c/td\u003e\n\u003ctd\u003eProfessor P M Marquis GBP265.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2019\u003c/td\u003e\n\u003ctd\u003eProfessor P M Marquis GBP28; E R Laidlar GBP144.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2020\u003c/td\u003e\n\u003ctd\u003eE R Laidlar GBP60; Professor P M Marquis GBP0.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2021\u003c/td\u003e\n\u003ctd\u003eE R Laidlar GBP171.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2022\u003c/td\u003e\n\u003ctd\u003eE R Laidlar GBP429; Professor P M Marquis GBP630.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2023\u003c/td\u003e\n\u003ctd\u003eE R Laidlar GBP1,078; Professor P M Marquis GBP0.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2024\u003c/td\u003e\n\u003ctd\u003eE R Laidlar GBP142.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2025\u003c/td\u003e\n\u003ctd\u003eProfessor P M Marquis GBP390; Mr E R Laidlar GBP22.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/section\u003e\n\u003csection id=\"logistics-and-enabling-costs\" class=\"level3\"\u003e\n\u003ch3\u003eLogistics and Enabling Costs\u003c/h3\u003e\n\u003cp\u003eThe source base identifies logistical activities but does not fully itemise their costs. The accounts now confirm major professional-fee totals for FY2011 and FY2012 and annual admin/examiner costs in later years. Visible cost-bearing activities included surveys, professional analysis, bridge work, steps, access ramp, car park, scaffolding, monorail, rubble removal, masonry conservation, interpretation design, contractor work, CDM/health-and-safety compliance, and opening-event logistics. Costs for most individual elements remain unavailable in the current local files.\u003c/p\u003e\n\u003c/section\u003e\n\u003csection id=\"visitor-donations\" class=\"level3\"\u003e\n\u003ch3\u003eVisitor Donations\u003c/h3\u003e\n\u003cp\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e consistently show that visitors understand the free-entry/donation model. Google \u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e mention a donation box, bank transfer, donations for upkeep, and voluntary support. \u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e mention a donation box, honesty box, scannable code, and upkeep dependence. This suggests donation optimisation is a practical lever. The accounts show total donations in recent years, but not donation-channel split or conversion rate.\u003c/p\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection id=\"12-project-team-contractors-and-stakeholders\" class=\"level2\"\u003e\n\u003ch2\u003e12. Project Team, Contractors, and Stakeholders\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eRole\u003c/th\u003e\n\u003cth\u003ePerson / Firm / Organisation\u003c/th\u003e\n\u003cth\u003eEvidence\u003c/th\u003e\n\u003cth\u003eNotes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eTrust / owner\u003c/td\u003e\n\u003ctd\u003eHopton Castle Preservation Trust\u003c/td\u003e\n\u003ctd\u003eAll institutional sources.\u003c/td\u003e\n\u003ctd\u003eCharity number \u003ccode\u003e1116210\u003c/code\u003e; company number \u003ccode\u003e04710194\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCompany profile\u003c/td\u003e\n\u003ctd\u003eHopton Castle Preservation Trust\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCompanies House\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eActive company limited by guarantee without share capital; incorporated 25 March 2003; SIC \u003ccode\u003e91030\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRegistered office evidence\u003c/td\u003e\n\u003ctd\u003eSwallows Barn / The Old Granary, Hopton Castle\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCompanies House\u003c/code\u003e; \u003ccode\u003eFiscal Filings\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCompanies House\u003c/code\u003e lists Swallows Barn, while FY2024/FY2025 accounts list The Old Granary. Verify current Companies House live record before using an address externally.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTrust chair, website-era\u003c/td\u003e\n\u003ctd\u003eJeff George\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eAlso credited with specialist expertise.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTrust secretary, website-era\u003c/td\u003e\n\u003ctd\u003ePeter Marquis\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e/contact details.\u003c/td\u003e\n\u003ctd\u003eCharity contact email in current \u003ccode\u003eCharity Register\u003c/code\u003e is \u003ccode\u003ep.m.marquis@bham.ac.uk\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTrust vice-chair / archaeological commentator\u003c/td\u003e\n\u003ctd\u003ePeter Curnow\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eEarlier Curnow work central to interpretation.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTreasurer, website-era\u003c/td\u003e\n\u003ctd\u003eTed Laidlar\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eCurrent \u003ccode\u003eCharity Register\u003c/code\u003e lists Edward Roy Laidlar as trustee appointed 2013.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eProject manager\u003c/td\u003e\n\u003ctd\u003eSula Rayska\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eArchaeological Survey\u003c/code\u003e acknowledgements.\u003c/td\u003e\n\u003ctd\u003eHelped assemble knowledge and liaised locally.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFunding/project contact\u003c/td\u003e\n\u003ctd\u003eTom Baker\u003c/td\u003e\n\u003ctd\u003e\u003 3ctd\u003eBill Klemperer\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eArchaeological Survey\u003c/code\u003e acknowledgements.\u003c/td\u003e\n\u003ctd\u003eRequested survey.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTime Team / Wessex Archaeology\u003c/td\u003e\n\u003ctd\u003eTime Team production team; Wessex Archaeology report referenced.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eAdded public archaeology and finds.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFunders\u003c/td\u003e\n\u003ctd\u003eHLF, English Heritage, Shropshire councils, AONB, European/rural-development sources, private/local donors.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e; \u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eSee funding section.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCurrent company secretary\u003c/td\u003e\n\u003ctd\u003ePeter Michael Marquis\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCompanies House\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eAppointed secretary 10 July 2014; also appears as director/trustee in other records.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCurrent Companies House directors\u003c/td\u003e\n\u003ctd\u003eMary Bason; Robert Bates; Jonathan Dean; Jeffrey William George; Valerie Kathleen George; Ann Elizabeth Jackson; Charles Franklin Jackson; Edward Roy Laidlar; Michael John Lynskey; Peter Michael Marquis; Duncan Price; Jane Elizabeth Lynda Price; Katherine Elizabeth Rollason; Robert Neville Rollason\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCompanies House\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eCompany-register compilation states 15 active officers: 1 secretary and 14 directors.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCurrent charity chair/trustee signal\u003c/td\u003e\n\u003ctd\u003eJeffrey/Jeffery William George\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCharity Register\u003c/code\u003e; \u003ccode\u003eCompanies House\u003c/code\u003e; \u003ccode\u003eFiscal Filings\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eName spelling varies slightly by source; FY2025 accounts say report signed by J W George.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCurrent charity trustees\u003c/td\u003e\n\u003ctd\u003eValerie Kathleen George; Michael John Lynskey; Ann Elizabeth Buchanan Jackson; Charles Franklin Jackson; Jane Elizabeth Lynda Price; Duncan Price; Robert Rollason; Katherine Rollason; Mary Bason; Robert Bates; Jonathan Dean; Edward Roy Laidlar; Professor Peter Michael Marquis\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCharity Register\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eCharity-register-style data; compare with \u003ccode\u003eCompanies House\u003c/code\u003e because charity trustees and company directors may be presented differently.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHistorical officer register\u003c/td\u003e\n\u003ctd\u003e52 total registered officers; 37 resigned officers.\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCompanies House\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003eUseful for governance timeline, continuity, and trustee/director turnover.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePatrons, website-era\u003c/td\u003e\n\u003ctd\u003eMr Heber-Percy; Philip Dunne MP; Lord John Julius Norwich\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e.\u003c/td\u003e\n\u003ctd\u003ePatron data may be historic.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMissing roles\u003c/td\u003e\n\u003ctd\u003eStructural engineer, quantity surveyor, legal services, tender/procurement manager\u003c/td\u003e\n\u003ctd\u003eNot identified in current source base.\u003c/td\u003e\n\u003ctd\u003eResearch gap; compare with Barholm/Ightham case-study roles.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe named team is strong for project management, conservation building, archaeology, architecture, funding, and current officer/trustee identification. It is weaker in the available source base for procurement mechanics, contract values, legal acquisition services, and named quantity-surveying or structural-engineering personnel. The annual accounts confirm that quantity surveyors and engineers attended project meetings, but do not name them.\u003c/p\u003e\n\u003c/section\u003e\n\u003csection id=\"13-current-use-visitor-experience-and-public-access\" class=\"level2\"\u003e\n\u003ch2\u003e13. Current Use, Visitor Experience, and Public Access\u003c/h2\u003e\n\u003cp\u003eHopton Castle is currently used as a free, unstaffed public heritage ruin with interpretation. It is not a staffed attraction, residence, commercial venue, or full-day destination. The charity's object is public preservation of historical, architectural, and constructional heritage in and around Hopton Castle.\u003c/p\u003e\n\u003csection id=\"official-access-and-safety\" class=\"level3\"\u003e\n\u003ch3\u003eOfficial Access and Safety\u003c/h3\u003e\n\u003cp\u003e\u003ccode\u003eCastle Website\u003c/code\u003e says visitor improvements included parking for 2 or 3 cars, an improved bridge, an information board, and an access ramp for visitors with impaired mobility or sight. It states there are no toilet facilities at the castle, nearest public toilets are in Clun, the village has no pubs, shops, or public transport, and the entry lanes are single-track.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e/\u003ccode\u003eInfographic 2\u003c/code\u003e state that the castle and grounds are unstaffed and entry is at the visitor's own risk. Listed hazards include uneven surfaces and grounds, reduced head height/light/access, unfenced pond, loose livestock/manure, and self-closing gates. The board also asks visitors not to climb on the castle, notes that there are no services, advises daylight viewing from 09.00 to 16.00, asks visitors to stay within the fenced boundary, lock cars, park at owner's risk, and take litter home.\u003c/p\u003e\n\u003c/section\u003e\n\u003csection id=\"visitor-experience-themes\" class=\"level3\"\u003e\n\u003ch3\u003eVisitor-Experience Themes\u003c/h3\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eTheme\u003c/th\u003e\n\u003cth\u003eVisitor Evidence\u003c/th\u003e\n\u003cth\u003eOperational Implication\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eShort visit / stop-off\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e and \u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e repeatedly describe the site as small, a quick visit, half-hour stop, or worth seeing if nearby.\u003c/td\u003e\n\u003ctd\u003eBest positioned as part of a wider itinerary, not a standalone day out.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFree access and parking\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e repeatedly praise free entry and free parking.\u003c/td\u003e\n\u003ctd\u003eFree model is valued; donation asks should remain low-friction and clearly linked to upkeep.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDonations accepted as fair\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e mention donation box, bank transfer, scannable code, and voluntary upkeep donations.\u003c/td\u003e\n\u003ctd\u003eStrong case for visible donation routes and updated signage/payment options.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLimited parking\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e says 2-3 cars; \u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e mention 3-4, 4-5, or 5-6 spaces and occasional parking conflict.\u003c/td\u003e\n\u003ctd\u003eCarrying capacity is low; marketing should avoid generating unmanaged surges.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNo services\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e and official guidance note no toilets, cafe, shop, bins, or guides.\u003c/td\u003e\n\u003ctd\u003eVisitor expectations must be managed; nearby facilities can be signposted digitally or in leaflets.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInterpretation quality\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e consistently praise information boards, storyboards, leaflets, and metal story book.\u003c/td\u003e\n\u003ctd\u003eInterpretation is a major value driver and should be maintained/refreshed.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCivil War story\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e often cite the siege, massacre, Time Team, and dark history as memorable.\u003c/td\u003e\n\u003ctd\u003eStrong basis for educational content and trail integration.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAccessibility constraints\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e mention ground-floor-only access, steps, uneven ground, and wheelchair difficulty.\u003c/td\u003e\n\u003ctd\u003eAccessibility should be assessed honestly; ramp does not equal full wheelchair access.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRural route difficulty\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e mention hidden/off-road location, narrow roads, GPS/signage issues, and weak bridge/car-only bridge.\u003c/td\u003e\n\u003ctd\u003eClear approach guidance matters; avoid assuming all visitors are comfortable on narrow lanes.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFamily/dog/picnic use\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e mention children, dogs, picnics, benches/tables, and quiet open space.\u003c/td\u003e\n\u003ctd\u003eLow-impact family/outdoor use fits current site character.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLandscape and nature\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e mention scenery, snowdrops, swallows/swifts, red kite, birds, stargazing, dark skies, and photography.\u003c/td\u003e\n\u003ctd\u003ePotential for seasonal/dark-sky/nature-sensitive interpretation, subject to evidence and conservation constraints.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNearby bundling\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e mention Clun, Ludlow, Hopton Heath, walks, other castles, railway, and local stays.\u003c/td\u003e\n\u003ctd\u003eStrong opportunity for regional trail and itinerary partnerships.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/section\u003e\n\u003csection id=\"visitor-model-assessment\" class=\"level3\"\u003e\n\u003ch3\u003eVisitor Model Assessment\u003c/h3\u003e\n\u003cp\u003eThe visitor model works because expectations are modest and interpretation is strong. People do not generally expect a large staffed castle; they value the site as a free, peaceful, well-maintained ruin with a compelling story. The main operational risk is mismatch: visitors who expect a larger attraction, more facilities, or easy accessibility may be disappointed. The site is best framed as a quiet heritage stop requiring self-sufficient visitors.\u003c/p\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection id=\"14-future-opportunities-and-constraints\" class=\"level2\"\u003e\n\u003ch2\u003e14. Future Opportunities and Constraints\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eOpportunity\u003c/th\u003e\n\u003cth\u003eSupporting Evidence\u003c/th\u003e\n\u003cth\u003eConstraint / Risk\u003c/th\u003e\n\u003cth\u003ePractical Next Step\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eDonation optimisation\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e already mention donation box, bank transfer, and scannable code; FY2025 accounts show donations of GBP2,636 and total income of GBP2,658.\u003c/td\u003e\n\u003ctd\u003eMust not make free access feel transactional; payment routes must be maintained.\u003c/td\u003e\n\u003ctd\u003eAudit current donation signage, online giving, QR code, and explanation of annual upkeep costs.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInterpretation refresh\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e strongly value boards, leaflets, and metal story book.\u003c/td\u003e\n\u003ctd\u003eOutdoor interpretation weathers; overloading boards can reduce clarity.\u003c/td\u003e\n\u003ctd\u003eReview condition and content of current panels; add digital companion content for deeper layers.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCivil War education\u003c/td\u003e\n\u003ctd\u003eSiege story is a major visitor memory; sources are rich.\u003c/td\u003e\n\u003ctd\u003eViolent history needs careful, factual handling.\u003c/td\u003e\n\u003ctd\u003eBuild a concise education pack or digital trail using Samuel More, Time Team, and site features.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEarthworks/water landscape interpretation\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eArchaeological Survey\u003c/code\u003e shows rich landscape features; reviews focus more on tower and boards.\u003c/td\u003e\n\u003ctd\u003eEarthworks are subtle and archaeologically sensitive.\u003c/td\u003e\n\u003ctd\u003eDevelop low-impact map/AR/audio interpretation rather than intrusive physical works.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVolunteer learning visits\u003c/td\u003e\n\u003ctd\u003ePendragon team interest includes volunteer experience; Hopton has visible conservation outcomes.\u003c/td\u003e\n\u003ctd\u003eSite is unstaffed and small; visits need coordination with Trust.\u003c/td\u003e\n\u003ctd\u003eApproach Trust for supervised learning day focused on conservation choices and maintenance.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRegional castle trail\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e and \u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e connect Hopton with Clun, Ludlow, Stokesay, Croft, Brampton Bryan, and Welsh Marches castles.\u003c/td\u003e\n\u003ctd\u003eParking and lane capacity limit high-volume promotion.\u003c/td\u003e\n\u003ctd\u003eFrame as dispersed itinerary, not mass event; coordinate with nearby attractions/facilities.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWalking/cycling integration\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e mention walkers, cyclists, Hopton Heath, Warfield Bank, forest car park, and countryside stops.\u003c/td\u003e\n\u003ctd\u003eNarrow roads and limited parking; safety concerns.\u003c/td\u003e\n\u003ctd\u003eProduce route guidance and public-transport caveats; verify rights of way and current access.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDigital engagement\u003c/td\u003e\n\u003ctd\u003eTime Team, literary links, archaeology, and maps are strong content pools.\u003c/td\u003e\n\u003ctd\u003eRequires ongoing maintenance and permissions for media.\u003c/td\u003e\n\u003ctd\u003eCreate source-cited web/PDF guide or QR-linked page rather than new on-site infrastructure.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSchools/literary trail\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e notes Kevin Crossley-Holland's Arthur trilogy and possible school/tourism materials.\u003c/td\u003e\n\u003ctd\u003eLiterary material may be secondary to conservation goals; rights/permissions may apply.\u003c/td\u003e\n\u003ctd\u003eReassess school-pack potential with Trust and local libraries/tourism bodies.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDark-sky / photography angle\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e mention Milky Way, clear skies, sunsets, and photography.\u003c/td\u003e\n\u003ctd\u003eOfficial board says daylight viewing 09.00-16.00; night access may conflict with safety.\u003c/td\u003e\n\u003ctd\u003eVerify current access rules before promoting any dark-sky use.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEcology/wildlife framing\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e mention birds, red kite, snowdrops, livestock, rural setting; AONB context is strong.\u003c/td\u003e\n\u003ctd\u003eNo formal ecology survey or sanctuary proposal in source base.\u003c/td\u003e\n\u003ctd\u003eTreat as interpretive/environmental context until ecological constraints/opportunities are researched.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMaintenance funding case\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e estimated GBP3,000 annual maintenance/insurance need; recent filed accounts show annual expenditure of GBP2,193 in FY2025, GBP2,610 in FY2024, and GBP3,093 in FY2023.\u003c/td\u003e\n\u003ctd\u003eNeed current cost categories before fundraising claims; total funds include restricted funds and the heritage asset, not just flexible cash.\u003c/td\u003e\n\u003ctd\u003eAsk Trust for current annual maintenance, insurance, inspection, restricted-fund policy, and donation figures.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003csection id=\"constraints\" class=\"level3\"\u003e\n\u003ch3\u003eConstraints\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eProtected status means future physical intervention likely requires heritage consent.\u003c/li\u003e\n\u003cli\u003eThe car park is very small and the approach lanes are narrow.\u003c/li\u003e\n\u003cli\u003eThe site is unstaffed and has no toilets, cafe, shop, bins, or guides.\u003c/li\u003e\n\u003cli\u003eAccessibility is limited by uneven ground, steps, reduced head height/light, and mound/ruin conditions.\u003c/li\u003e\n\u003cli\u003eCurrent unrestricted income appears modest relative to even small maintenance needs; FY2025 unrestricted funds were GBP10,731.\u003c/li\u003e\n\u003cli\u003eArchaeological earthworks and water features are part of the asset and must not be harmed by visitor improvements.\u003c/li\u003e\n\u003cli\u003eThe site's public value partly depends on its quiet, rural character; over-commercialisation would conflict with visitor sentiment and site capacity.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe strongest future direction is not commercial intensification. It is a conservation-compatible support model: better donation pathways, clearer digital interpretation, regional itinerary integration, volunteer/education use, and careful maintenance of existing access.\u003c/p\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n\u003csection id=\"15-final-takeaways-for-pendragon-foundation\" class=\"level2\"\u003e\n\u003ch2\u003e15. Final Takeaways for Pendragon Foundation\u003c/h2\u003e\n\u003cp\u003eHopton Castle is a useful model for rescuing a small ruined castle without forcing it into a residential or high-commercial use. Its success appears to have come from a strong public-benefit case, local campaigning, expert archaeological and conservation input, major grant funding, and a realistic end state: stabilised ruin, protected fabric, visitor access, and interpretation. The Companies House accounts now show the financial shape of that transition: a capital project with six-figure annual income/expenditure in FY2011-FY2012, followed by a much smaller stewardship charity whose ordinary income is usually measured in low thousands.\u003c/p\u003e\n\u003cp\u003eOn the evidence available, the apparent objectives were largely achieved. The Trust bought the castle and surrounding earthworks, repaired and conserved the monument, made it available to the public, installed interpretation, and secured strong visitor appreciation. The current site is widely perceived as well maintained and worthwhile despite being small and unstaffed.\u003c/p\u003e\n\u003cp\u003eThe core caution is sustainability. Capital rescue funding solved the immediate collapse/access problem, but recent finance shows a small charity operating on modest unrestricted income, with restricted funds and a heritage asset making up much of the balance-sheet position. For Pendragon, the lesson is that any restoration feasibility study must separate capital rescue from long-term stewardship. The practical follow-up should focus on current maintenance costs, consent constraints, title/boundary data, donation performance, restricted-fund use, and whether the Trust has specific priorities where Pendragon support would be useful.\u003c/p\u003e\n\u003c/section\u003e\n\u003csection id=\"appendix-a-source-reliability-notes\" class=\"level2\"\u003e\n\u003ch2\u003eAppendix A: Source Reliability Notes\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eSource\u003c/th\u003e\n\u003cth\u003eBest Use\u003c/th\u003e\n\u003cth\u003eCaution\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eCharity Register\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eCurrent/recent charity status, trustees, finance, contact, legal form.\u003c/td\u003e\n\u003ctd\u003eDoes not explain restoration narrative in depth; recent finance is post-capital project.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eCompanies House\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eCompanies House company identity, SIC code, filing deadlines, current active officers, and historical officer appointments/resignations.\u003c/td\u003e\n\u003ctd\u003eCompany-register data can differ from charity-register presentation; address data should be checked against the latest live record before external use.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eFiscal Filings\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eFiled annual accounts, year-by-year income/expenditure/funds, restoration-era trustee-report notes, professional-fee totals, related-party reimbursements, fund movements.\u003c/td\u003e\n\u003ctd\u003eClean summaries are OCR-derived; older FY2005-FY2010 accounts are less normalized and should be checked against PDFs for accounting-critical use.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eBroad website synthesis across history, access, funding, team, Time Team, contacts.\u003c/td\u003e\n\u003ctd\u003eSome trustee/contact details are website-era and superseded by \u003ccode\u003eCharity Register\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eArchaeological Survey\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSpecialist archaeology, earthworks, landscape, water features, siege appendix.\u003c/td\u003e\n\u003ctd\u003ePredates 2011 opening and later restoration outcomes.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eBBC\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eExternal confirmation of 2011 opening, GBP1m restoration, English Heritage arch permission.\u003c/td\u003e\n\u003ctd\u003eShort news summary, not a technical or financial report.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 1\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eOn-site board content, funders, safety, conservation messaging.\u003c/td\u003e\n\u003ctd\u003eAI extraction from weathered/angled photo; includes uncertain readings.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eInfographic 2\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSecond extraction of board content and logos.\u003c/td\u003e\n\u003ctd\u003eConflicts with ChatGPT extraction on rubble volume.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eRecent visitor sentiment, practical operations, donations, accessibility, amenities.\u003c/td\u003e\n\u003ctd\u003eVisitor perception only; some entries blank or historically unreliable.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eNarrative visitor accounts, older and recent visitor themes.\u003c/td\u003e\n\u003ctd\u003eContains duplicated older entries; not primary history.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/section\u003e\n\u003csection id=\"appendix-b-named-organisations-index\" class=\"level2\"\u003e\n\u003ch2\u003eAppendix B: Named Organisations Index\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eOrganisation\u003c/th\u003e\n\u003cth\u003eWebsite\u003c/th\u003e\n\u003cth\u003eRole in Hopton Castle Endeavour\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eArchitectural Heritage Fund\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://ahfund.org.uk/\"\u003eahfund.org.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eFY2008 accounts record a successful GBP6,000 bid; named restoration supporter.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eBarclays Bank Plc\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://www.barclays.co.uk/\"\u003ebarclays.co.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eBanker named in Companies House annual accounts.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCompanies House\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://www.gov.uk/government/organisations/companies-house\"\u003egov.uk/government/organisations/companies-house\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eSource of company registration, officer-register, and filed-account evidence.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eConservation Building Services\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://www.cbsconservation.co.uk/\"\u003ecbsconservation.co.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eSuccessful conservation contractor for the repair/access works, according to filed accounts and website notes.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eD.R.E. \u0026amp; Co. / D.R.E. \u0026amp; Co. Limited\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://dre.co.uk/\"\u003edre.co.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eIndependent examiner/accountants named in the filed accounts.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDefra\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://www.gov.uk/government/organisations/department-for-environment-food-rural-affairs\"\u003egov.uk/government/organisations/department-for-environment-food-rural-affairs\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eLinked to rural-development programme support named on the interpretation-board extractions.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEnglish Heritage\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://www.english-heritage.org.uk/\"\u003eenglish-heritage.org.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eMajor funder/adviser; commissioned survey work and gave permission for specific arch rebuilding per BBC.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEuropean Agricultural Fund for Rural Development\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://agriculture.ec.europa.eu/common-agricultural-policy/rural-development_en\"\u003eagriculture.ec.europa.eu/common-agricultural-policy/rural-development_en\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eRural-development funding stream named in board/source evidence.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEuropean Union\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://european-union.europa.eu/\"\u003eeuropean-union.europa.eu\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eWider institutional source behind European rural-development support named in source evidence.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eForestry Commission\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://www.gov.uk/government/organisations/forestry-commission\"\u003egov.uk/government/organisations/forestry-commission\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eSupporter named in interpretation-board extraction; precise contribution not itemised.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFormer South Shropshire District Council\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://www.shropshire.gov.uk/\"\u003eshropshire.gov.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eHistoric local authority; FY2008 accounts record a successful GBP25,000 bid.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHeritage Lottery Fund / National Lottery Heritage Fund\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://www.heritagefund.org.uk/\"\u003eheritagefund.org.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eMain capital funder; website notes report GBP880,000 largest grant.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHistoric England\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://historicengland.org.uk/\"\u003ehistoricengland.org.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eNot directly represented as a local source body, but likely modern route for list/schedule/consent verification.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHopton Castle Preservation Trust / HCPT\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://hoptoncastle.org.uk/\"\u003ehoptoncastle.org.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eOwner/operator and restoration delivery charity/company.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMillichope Foundation\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://register-of-charities.charitycommission.gov.uk/\"\u003eCharity Commission register\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003ePrivate/philanthropic supporter named in interpretation-board extraction; amount not itemised.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMinistry of Works\u003c/td\u003e\n\u003ctd\u003eNo current standalone site; historic UK government department\u003c/td\u003e\n\u003ctd\u003eMid-20th-century inspection/minor-repair context in website history.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRichard K. Morriss and Associates\u003c/td\u003e\n\u003ctd\u003eNo verified current standalone website identified\u003c/td\u003e\n\u003ctd\u003eArchaeological and architectural analysis source named by website notes.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRural Development Programme for England\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://www.gov.uk/rural-development-programme-for-england\"\u003egov.uk/rural-development-programme-for-england\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eRural-development support context for board-listed funders.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eShropshire Council\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://www.shropshire.gov.uk/\"\u003eshropshire.gov.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eLocal authority and funding channel; FY2010 accounts record Leader/LJC support via Shropshire Council.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eShropshire Council Local Joint Committee\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://www.shropshire.gov.uk/\"\u003eshropshire.gov.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eLocal joint-committee funding; accounts record GBP10,000 and later GBP2,500 contributions.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eShropshire County Council\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://www.shropshire.gov.uk/\"\u003eshropshire.gov.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eHistoric county-council support; accounts record SCC-related early and economic-regeneration funding.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eShropshire Hills AONB Partnership / Shropshire Hills National Landscape\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://shropshirehills-nl.org.uk/\"\u003eshropshirehills-nl.org.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eLandscape/cultural-heritage context and supporter named in website/board evidence.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eShropshire Hills LEADER Local Action Group\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://www.shropshire.gov.uk/\"\u003eshropshire.gov.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eRural-development/local-action support; FY2010 accounts record GBP30,000 Leader Fund via Shropshire Council.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eShropshire Hills Sustainable Development Fund\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://shropshirehills-nl.org.uk/\"\u003eshropshirehills-nl.org.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eFY2008 accounts record AONB SDF bid of GBP4,000.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eShropshire Tourism Action Plan\u003c/td\u003e\n\u003ctd\u003eNo current standalone site identified; see \u003ca href=\"https://www.shropshire.gov.uk/\"\u003eShropshire Council\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eTourism-related support named in interpretation-board extraction; amount not itemised.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe Leverhulme Trust\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://www.leverhulme.ac.uk/\"\u003eleverhulme.ac.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eFY2008 accounts list GBP3,000 contribution/support.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTime Team\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://timeteamdigital.com/\"\u003etimeteamdigital.com\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003ePublic archaeology/media project; visited Hopton in June 2009 according to website notes.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWessex Archaeology\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://www.wessexarch.co.uk/\"\u003ewessexarch.co.uk\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eArchaeology body associated with the Time Team report/work referenced in website notes.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/section\u003e\n\u003csection id=\"appendix-c-evidence-gaps-and-further-research-questions\" class=\"level2\"\u003e\n\u003ch2\u003eAppendix C: Evidence Gaps and Further Research Questions\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eGap / Question\u003c/th\u003e\n\u003cth\u003eWhy It Matters\u003c/th\u003e\n\u003cth\u003eLikely Next Source or Action\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eFull consent pathway\u003c/td\u003e\n\u003ctd\u003eNeeded to understand regulatory process and future intervention constraints.\u003c/td\u003e\n\u003ctd\u003eHistoric England records; local planning authority; Trust archive.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eScheduled Monument entry and exact Grade I listing details\u003c/td\u003e\n\u003ctd\u003eCurrent source base states status but does not include official entries.\u003c/td\u003e\n\u003ctd\u003eHistoric England official list/schedule records.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePurchase consideration and transaction terms\u003c/td\u003e\n\u003ctd\u003eAccounts carry the heritage/capital asset at GBP50,000, but the source base does not show conveyance terms or explicitly reconcile carrying value to full purchase consideration.\u003c/td\u003e\n\u003ctd\u003eTrust archive; conveyancing records if accessible; Land Registry/title documents.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOwnership boundary\u003c/td\u003e\n\u003ctd\u003eFY2009 accounts give a five-and-a-half-acre curtilage, but no mapped boundary.\u003c/td\u003e\n\u003ctd\u003eLand Registry; Trust property records; site plan.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDetailed capital budget\u003c/td\u003e\n\u003ctd\u003eFiled accounts now show annual income/expenditure and major professional-fee totals, but not technical cost drivers.\u003c/td\u003e\n\u003ctd\u003eHLF project file; Trust archive; final project report.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePhase-by-phase cost schedule\u003c/td\u003e\n\u003ctd\u003eNeeded to compare with Ightham/Barholm-style case studies and understand which costs attached to masonry, access, archaeology, interpretation, and preliminaries.\u003c/td\u003e\n\u003ctd\u003eQuantity surveyor/project manager records; grant claims.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTender/procurement process\u003c/td\u003e\n\u003ctd\u003eNeeded to understand contractor selection and project delivery.\u003c/td\u003e\n\u003ctd\u003eTrust minutes; tender documents; funder records.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNamed structural engineer\u003c/td\u003e\n\u003ctd\u003eEngineer attendance is indicated in accounts, but individual/firm names are missing.\u003c/td\u003e\n\u003ctd\u003eProject files; architect/conservation contractor records.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNamed quantity surveyor\u003c/td\u003e\n\u003ctd\u003eQuantity-surveying involvement is indicated in accounts, but individual/firm names are missing.\u003c/td\u003e\n\u003ctd\u003eProject files; grant records.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLegal services\u003c/td\u003e\n\u003ctd\u003eMissing from named team.\u003c/td\u003e\n\u003ctd\u003eAcquisition records; Trust minutes.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOriginal restoration reports/specifications\u003c/td\u003e\n\u003ctd\u003eNeeded for technical conservation detail.\u003c/td\u003e\n\u003ctd\u003eTrust archive; architects; Conservation Building Services; English Heritage/Historic England.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMaintenance plan after 2011\u003c/td\u003e\n\u003ctd\u003eNeeded for current sustainability assessment.\u003c/td\u003e\n\u003ctd\u003eTrust maintenance plan; inspection records.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCurrent visitor numbers\u003c/td\u003e\n\u003ctd\u003eNeeded for opportunity and risk analysis.\u003c/td\u003e\n\u003ctd\u003eTrust estimates; counters if any; donation records; local tourism data.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCurrent donation channel split\u003c/td\u003e\n\u003ctd\u003eAccounts show donations totals but not on-site box, QR, bank transfer, online giving, Gift Aid, or event splits.\u003c/td\u003e\n\u003ctd\u003eTrust accounts/internal records.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCurrent insurance and maintenance cost breakdown\u003c/td\u003e\n\u003ctd\u003eAccounts show annual expenditure totals, but not a detailed maintenance/insurance/inspection split.\u003c/td\u003e\n\u003ctd\u003eTrust financial records; invoices; maintenance plan.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRegistered office reconciliation\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCompanies House\u003c/code\u003e lists Swallows Barn while FY2024/FY2025 accounts list The Old Granary.\u003c/td\u003e\n\u003ctd\u003eLive Companies House profile; latest filed confirmation statement; Trust contact.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCurrent accessibility assessment\u003c/td\u003e\n\u003ctd\u003eNeeded before recommending access improvements.\u003c/td\u003e\n\u003ctd\u003eSite audit; access consultant; Trust.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCurrent signage/opening-hours status\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eGoogle Reviews\u003c/code\u003e/\u003ccode\u003eTripAdvisor Reviews\u003c/code\u003e and board extraction conflict on evening/no-hours access versus 09.00-16.00 daylight guidance.\u003c/td\u003e\n\u003ctd\u003eSite visit; current Trust website/signage.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOriginal interpretation-board image verification\u003c/td\u003e\n\u003ctd\u003eNeeded to resolve rubble-volume conflict.\u003c/td\u003e\n\u003ctd\u003eOriginal photo or board text; restoration report.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eEcological/wildlife constraints or opportunities\u003c/td\u003e\n\u003ctd\u003eNeeded before wildlife sanctuary/conservation claims.\u003c/td\u003e\n\u003ctd\u003eEcology survey; AONB/local biodiversity records.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFuture archaeology plans\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCastle Website\u003c/code\u003e notes hope for further work, but current status unknown.\u003c/td\u003e\n\u003ctd\u003eTrust/Historic England/Wessex Archaeology follow-up.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/section\u003e\n\u003csection id=\"appendix-d-visitor-review-theme-index\" class=\"level2\"\u003e\n\u003ch2\u003eAppendix D: Visitor-Review Theme Index\u003c/h2\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eTheme\u003c/th\u003e\n\u003cth\u003eSource Signal\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eStrong positives\u003c/td\u003e\n\u003ctd\u003ePeaceful, scenic, well maintained, interesting history, excellent boards, free access.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCommon use case\u003c/td\u003e\n\u003ctd\u003eShort stop, half-hour visit, picnic, dog/family walk, castle trail, local stay add-on.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePractical limits\u003c/td\u003e\n\u003ctd\u003eSmall car park, no toilets, no cafe/shop, no bins, no guides, narrow lanes.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAccess limits\u003c/td\u003e\n\u003ctd\u003eUneven ground, steps, ground-floor-only access, wheelchair difficulty.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDonation signals\u003c/td\u003e\n\u003ctd\u003eDonation box, scannable code, bank transfer, voluntary upkeep support.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInterpretation signals\u003c/td\u003e\n\u003ctd\u003eStoryboards, free leaflets, metal book, Time Team references, Civil War story.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePartnership signals\u003c/td\u003e\n\u003ctd\u003eClun, Ludlow, Stokesay, Hopton Heath, walks, Shropshire Hills, other castles.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNature/landscape signals\u003c/td\u003e\n\u003ctd\u003eSnowdrops, birds, swallows/swifts, red kite, dark skies, stargazing, photography.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003c/section\u003e\n\u003c/section\u003e\n","text":"Hopton Castle Research Report: Restoration, Governance, Visitor Use, and Future Potential Prepared for: Pendragon Foundation research team Evidence base: local sources/ files only Primary routing file: source index.md Research brief followed: investigative angle/Pendragon Working Brief Hopton Castle Master Research Brief.md Evidence Note This report is source grounded in the markdown files currently available in sources/ . It does not use live web verification. Where the available source base does not contain a figure, consent document, contract record, or current operational metric, the report marks that item as a gap rather than inferring it. The report uses readable source labels in evidence tables and source notes. The strongest sources for institutional facts are now Fiscal Filings , Companies House , Charity Register , Castle Website , Archaeological Survey , and BBC . Fiscal Filings is especially important for filed annual finance and trustee report details; Companies House is especially important for company status and officer history. Infographic 1 and Infographic 2 are useful but imperfect AI readings of an outdoor interpretation board. Google Reviews and TripAdvisor Reviews are used as visitor perception evidence, not as historical authority. Source Key Source Label Source File Source Type Index source index.md Clean source reference guide and routing index BBC BBC News Hopton Castle Reopened After Restoration.md BBC News article Archaeological Survey English Heritage Archaeological Survey Hopton Castle Earthworks.md English Heritage archaeological survey report Castle Website Hopton Castle Website Compiled Structured Notes.md Compiled Hopton Castle website notes Charity Register GOVUK Charity Register Hopton Castle Preservation Trust.md GOV.UK / charity register style record Companies House Companies House Register Hopton Castle Preservation Trust Company Overview Officer Register.md Companies House company profile and officer register Fiscal Filings Companies House Accounts Hopton Castle Preservation Trust/ Clean summary files from Companies House annual accounts, FY2005 FY2025 Infographic 1 Infographic Board ChatGPT Extraction.md ChatGPT extraction from on site infographic board Infographic 2 Infographic Board Gemini Extraction.md Gemini extraction from on site infographic board Google Reviews Google Reviews Hopton Castle.md Google reviews scrape TripAdvisor Reviews TripAdvisor Reviews Hopton Castle.md TripAdvisor reviews scrape 1. Executive Summary Hopton Castle is a ruined medieval tower house and earthwork complex in south Shropshire, near Craven Arms and Ludlow, within the Shropshire Hills Area of Outstanding Natural Beauty. The available evidence presents it as a small but nationally significant site: a Scheduled Ancient Monument according to Infographic 1 / Infographic 2 , Grade I listed according to BBC , a probable late 13th or early 14th century lordly residence, and a Civil War site associated with the 1644 siege and killing of the Parliamentarian garrison. The modern project was not a full domestic restoration. It was principally a conservation, repair, and public access project. Hopton Castle Preservation Trust rescued a collapsing ruin, purchased the castle and surrounding earthworks, repaired and stabilised the monument, protected the earthworks during works, added visitor access and interpretation, and opened the site free to the public. The castle was not converted into a residence, major visitor attraction, commercial venue, or staffed heritage site. The Trust secured more than GBP1 million from Heritage Lottery Fund and other sources. Castle Website identifies Heritage Lottery Fund as the main funder, with a largest grant of GBP880,000, and English Heritage as a major contributor at about GBP250,000. The newly integrated Companies House accounts sharpen the sequence: FY2006 records GBP50,000 recognised restricted grant income split between HLF GBP45,000 and Shropshire County Council GBP5,000; FY2007 FY2009 accounts record the major HLF/EH grant awards and additional named bids; FY2010 records match funding and the start of physical works; and FY2011 FY2012 capture the largest restoration expenditure. The Charity Commission style data records purchase on 15 September 2008 and works scheduled for completion in October 2011. Public access began at the end of September 2011, and the Duke of Gloucester officially opened the site on 1 December 2011. Current use is low intensity public heritage access. Google Reviews / TripAdvisor Reviews consistently describe a small, free, unstaffed, well maintained ruin with strong interpretation, limited parking, no toilets or services, and donation dependent upkeep. The latest filed accounts show a small operating charity: FY2025 income of GBP2,658, expenditure of GBP2,193, unrestricted funds of GBP10,731, restricted funds of GBP76,814, and total funds of GBP87,545. The Companies House register shows an active company limited by guarantee, incorporated on 25 March 2003, with SIC code 91030 , 15 active officers, and accounts made up to 31 March 2025. Key Findings Hopton is best treated as a ruin conservation and public access case study , not a residential restoration case. The project was justified by a combination of national significance, collapse risk, Civil War history, architectural interest, AONB landscape value, and local campaigning. The strongest known funding figures are: over GBP1 million total secured, GBP880,000 from Heritage Lottery Fund, about GBP250,000 from English Heritage, and filed account restoration expenditure of GBP519,635 in FY2011 and GBP219,092 in FY2012. The Companies House accounts confirm a sharp transition from capital rescue to maintenance operation: after the major works period, annual income mostly sits in the low thousands, with FY2022 as a donation/grant outlier. The company register adds current governance context: the active company has 15 active officers, including one secretary and 14 directors, with 52 total registered officers and 37 resignations across its history. The source base does not provide a detailed capital cost schedule, conveyancing terms, tender records, full consent pathway, visitor numbers, or current maintenance plan; it does now show a GBP50,000 heritage/capital asset value in the accounts. Visitor experience evidence is strong: Hopton works well as a short, quiet, donation supported, interpretation rich stop within a wider Shropshire/Welsh Marches heritage and walking itinerary. Future opportunity appears strongest in low impact areas: donations, interpretation, trails, volunteer learning, digital engagement, archaeology led education, and sensitive landscape/ecology framing. 2. Site Identity and Heritage Status Item Evidence Source Location Hopton Castle is in south Shropshire, near Craven Arms, about 10 miles west or 11 miles north west of Ludlow, between the Clun and Teme valleys. Archaeological Survey ; Castle Website ; BBC Google Maps Open Hopton Castle on Google Maps Google Maps link provided for navigation. Grid/reference data NGR SO 367 779 ; NMR SO 37 NE 27 ; parish Hopton Castle; district South Shropshire. Archaeological Survey Setting Valley bottom site at about 150m OD, in a small valley opening into a substantial bowl surrounded by hills. Archaeological Survey Landscape designation Within the Shropshire Hills AONB, described as part of the area's cultural heritage and distinctive character. Castle Website ; Infographic 1 / Infographic 2 Building/site type Ruined medieval fortified tower house or lordly residence with surrounding earthworks, rather than a defensive keep in the strict sense. Archaeological Survey ; Castle Website Date and interpretation The source places the visible tower in the late 13th or early 14th century, possibly built in an intentionally archaic form resembling a Norman donjon. Archaeological Survey Heritage status Infographic 1 / Infographic 2 call it a Scheduled Ancient Monument; BBC calls it Grade I listed. Infographic 1 ; Infographic 2 ; BBC Ownership/charity/company status Hopton Castle Preservation Trust is charity number 1116210 and company number 04710194 ; it is an active company limited by guarantee, incorporated 25 March 2003, with SIC code 91030 . Charity Register ; Companies House Filed account heritage asset treatment Companies House accounts carry Hopton Castle / heritage assets at GBP50,000 from the acquisition/restoration period onward. Fiscal Filings Interpretive Position Hopton Castle should be described carefully. The word castle is locally and historically established, but the physical evidence points to a high status residential tower house or manorial complex rather than a purely military stronghold. The Archaeological Survey describes the surviving tower as a grand lordly residence requiring ancillary service buildings. It notes deliberate archaic references to Norman keep forms, but stresses that the tower was not self sufficient. The site also extends beyond the tower. The earthworks include a mound, bailey like enclosure, possible outer bailey or garden compartment, water management features, ornamental ponds, a leat, possible building platforms, and other unresolved features. This makes Hopton a landscape and archaeology case as much as a masonry repair case. Why This Site Was a Compelling Conservation Target The available sources identify several overlapping reasons: The castle was at risk of total collapse according to the Infographic 1 / Infographic 2 . It was nationally significant because of its Scheduled Ancient Monument status, early 14th century tower house character, and Civil War siege history. It sat within the Shropshire Hills AONB and formed part of the cultural landscape of the Welsh Marches. It had a strong public story: the 1644 siege, Hopton Quarter , and later ruin. Local campaigning had already built institutional momentum through the Trust and Friends network. The site had enough surviving fabric and earthwork context to make conservation meaningful, but required intervention before further loss. Land and Earthwork Context The sources state that the Trust purchased the castle and surrounding earthworks, and the FY2009 Companies House summary describes the acquired curtilage as five and a half acres. The archaeological record makes clear that the meaningful conservation area is broader than the tower: it includes the mound, bailey, outer space or garden compartment, water features, leat, possible building platforms, and nearby earthworks. The exact mapped ownership boundary remains a research gap even though the account narrative gives the acreage/curtilage description. 3. Image Orientation and Catalogue The image catalogue uses the current A B C D wall convention. The raw image folder is not the naming authority for this appendix; the standardized files in images/ are. In this convention, wall A has the main entrance. Top Down Orientation Diagram Exterior Images Wall A outside 01 Wall A outside 02 Wall A outside 03 Wall A outside 04 Wall A outside 05 Wall A outside 06 Wall A outside 07 Wall A outside 08 Wall A outside 09 Wall A outside 10 Corner AB outside 01 Corner AB outside 02 Wall B outside 01 Wall B outside 02 Wall B outside 03 Wall B outside 04 Wall B outside 05 Wall C outside 01 Wall C outside 02 Wall C outside 03 Corner CD outside 01 Corner CD outside 02 Corner CD outside 03 Corner CD outside 04 Corner CD outside 05 Wall D outside 01 Wall D outside 02 Wall D outside 03 Corner DA outside 01 Corner DA outside 02 Corner DA outside 03 Corner DA outside 04 Corner DA outside 05 Interior Images Wall A inside 01 Wall A inside 02 Wall A inside 03 Wall B inside 01 Wall B inside 02 Wall B inside 03 Wall B inside 04 Wall C inside 01 Wall C inside 02 Corner DC inside 01 Corner DC inside 02 Wall D inside 01 Corner AD inside 01 Miscellaneous Images infographic board 01 site satellite image 01 site sign post 01 story board 01 story board 02 surrounding landscape 01 window view 01 4. Historical Development The site sits in a landscape with prehistoric and early settlement evidence. The Archaeological Survey records late prehistoric enclosures visible as cropmarks south east of the castle and scatters of prehistoric stone tools along the ridge to the north. Hopton appears in Domesday as Opetune , though Archaeological Survey cautions that it is doubtful whether this refers to a nucleated settlement on the present village site. Castle Website gives the early ownership sequence as Eadric before the Norman Conquest, Roger de Montgomery by Domesday, Picot de Say as tenant, and Walter de Opton/de Hopton by 1165. The de Hoptons held the estate into the 15th century. The earliest written reference cited in Castle Website is to the castles of Hoptoune in a 1264 case against Sir Walter de Hopton. The surviving tower is most likely late 13th or early 14th century. The Archaeological Survey identifies it as a lordly residence, probably associated with Walter de Hopton, and places it among substantial Shropshire houses built in the generation after Edward I's conquest of Wales. It compares the site with Clun, Acton Burnell, Stokesay, and possibly Wattlesborough. The estate later passed through the Corbets of Moreton Corbet and then to the Wallops. Sir Henry Wallop is reported to have made improvements, though the extent is uncertain. Archaeological Survey and Castle Website both refer to a new brick house likely associated with the early modern Wallop period and apparently located within the bailey enclosure. The Civil War episode dominates the public history. In 1644, Hopton Castle was held for Parliament by a small garrison commanded by Samuel More. Royalist forces associated with Prince Rupert and led locally by Sir Michael Woodhouse besieged the site. After the defenders surrendered, most of the garrison were reportedly killed. The phrase Hopton Quarter became a byword for treacherous or merciless treatment. After the siege, the castle appears to have been abandoned as a residence. Castle Website says 17th century tax records suggest no one lived in the castle after the Civil War, and 18th and 19th century depictions show a ruin similar to the modern outline. Ownership later passed to the Beale family, then to Sir Edward Ripley in 1890, and in the mid 1950s to the Williams family, farmers in Hopton Castle. The 20th century record is one of limited action and increasing fragility. A Ministry of Works inspector requested a fence in 1946 to prevent cattle damage. The Williams family later contacted the Ministry of Works about the danger posed by the fragile building, but the estimated repair cost of GBP17,000 could not be afforded. Minor Ministry of Works repairs in the 1950s and 1960s kept the monument standing, but the larger preservation campaign only revived in the mid 1990s through local people later represented by Hopton Castle Preservation Trust. 5. Pre Restoration Condition and Conservation Need The pre restoration condition was a ruined and fragile medieval tower house, abandoned since the Civil War and vulnerable to collapse. Infographic 1 / Infographic 2 state that the building was in danger of total collapse despite its national significance. The Castle Website records decades of minimal repairs, cattle damage concern, unaffordable mid century repair estimates, and continuing fabric loss. Risk Category Evidence Implication for Conservation Structural/fabric risk Infographic 1 / Infographic 2 state the castle was in danger of total collapse; BBC describes a ruin restored at about GBP1m cost. Stabilisation and masonry repair were essential before safe public access. Weathering risk Board captions describe sealing wall tops against rainwater and weather. Exposed wall heads needed protection to prevent continuing decay. Rubble/debris risk Board captions describe removal of a large volume of rubble to reveal original floor level. Interior archaeology and safe access required controlled clearance. Earthwork risk Board captions say a small monorail was used to avoid damaging earthworks during debris removal. Conservation had to protect archaeological deposits beyond the tower walls. Access/safety risk Castle Website notes later bridge, steps, ramp, car park, and information board; board warns of uneven surfaces, reduced head height/light, unfenced pond, livestock/manure, and self closing gates. Public access required infrastructure and safety messaging, but did not eliminate inherent rural ruin hazards. Knowledge risk Castle Website notes initial surveys were needed to support purchase and rescue bids. Archaeological and architectural understanding was part of project justification and design. Before / After Summary Dimension Before Project After Project Evidence Structural condition Long abandoned ruin; fragile fabric; danger of collapse. Stabilised, repaired, wall heads protected, limited arches rebuilt where collapse risk justified it. Castle Website ; Infographic 1 / Infographic 2 ; BBC Public access No developed visitor access; frustration over lack of access noted in literary/book trail context. Open to visitors from end of September 2011; officially opened 1 December 2011. Castle Website ; BBC Ownership/governance Privately owned ruin before Trust purchase. Held by Hopton Castle Preservation Trust, an active company
